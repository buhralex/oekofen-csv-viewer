    // ─── IndexedDB History Module (v1.2 Phase 7 — DACC-01/02/03) ─
    const HISTORY_DB_NAME    = 'oekofen-history';
    const HISTORY_DB_VERSION = 1;
    const HISTORY_STORE      = 'days';

    // Open (or upgrade) the IndexedDB database.
    // Returns a Promise<IDBDatabase>.
    // Store schema: keyPath='date' (string YYYYMMDD).
    async function openHistoryDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(HISTORY_STORE)) {
            db.createObjectStore(HISTORY_STORE, { keyPath: 'date' });
          }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    // Upsert (put) a record. Existing record for same date is replaced.
    // date: string YYYYMMDD; csvString: raw decoded CSV text.
    async function upsertHistoryDay(date, csvString) {
      if (!date) return;   // no date = cannot key — skip silently
      const db = await openHistoryDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(HISTORY_STORE, 'readwrite');
        tx.objectStore(HISTORY_STORE).put({ date, csvString, storedAt: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
      });
    }

    // Return all stored records sorted by date ascending.
    async function getAllHistoryDays() {
      const db = await openHistoryDb();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(HISTORY_STORE, 'readonly');
        const req = tx.objectStore(HISTORY_STORE).getAll();
        req.onsuccess = e => resolve(
          (e.target.result || []).sort((a, b) => a.date.localeCompare(b.date))
        );
        req.onerror = e => reject(e.target.error);
      });
    }

    // Clear all records.
    async function clearHistoryDb() {
      const db = await openHistoryDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(HISTORY_STORE, 'readwrite');
        tx.objectStore(HISTORY_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
      });
    }

    // Parse date from first data row of CSV string.
    // OekoFEN CSV Datum format: DD.MM.YYYY (e.g., "12.01.2026")
    // Returns YYYYMMDD string or null if not parseable.
    function parseDateFromCsvString(csvString) {
      if (!csvString) return null;
      const lines = csvString.split('\n');
      // Skip header rows (first row is headers); find first data row
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = line.split(';');
        const datum = (cols[0] || '').trim();
        // Match DD.MM.YYYY
        const m = datum.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (m) {
          return m[3] + m[2] + m[1]; // YYYYMMDD
        }
      }
      return null;
    }

    // ─── History Indicator UI (v1.2 Phase 7 — DACC-02/03) ─────────

    // Format YYYYMMDD -> YYYY-MM-DD for display
    function formatHistoryDate(yyyymmdd) {
      if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
      return yyyymmdd.slice(0,4) + '-' + yyyymmdd.slice(4,6) + '-' + yyyymmdd.slice(6,8);
    }

    async function updateHistoryIndicator() {
      const el = document.getElementById('history-indicator');
      if (!el) return;
      try {
        const days = await getAllHistoryDays();
        if (days.length === 0) {
          el.textContent = '';
          el.innerHTML   = '';
          return;
        }
        const count = days.length;
        const first = formatHistoryDate(days[0].date);
        const last  = formatHistoryDate(days[days.length - 1].date);
        const range = count === 1 ? first : first + ' \u2013 ' + last;
        // Render as: "12 days stored: 2026-01-14 – 2026-02-25   [Clear]"
        el.innerHTML =
          count + ' day' + (count === 1 ? '' : 's') + ' stored: ' + range +
          '&nbsp;&nbsp;<button id="clear-history-btn" style="background:none; border:none; color:var(--text-3); font-size:11px; cursor:pointer; font-family:var(--font); text-decoration:underline; padding:0;">Clear</button>';
        document.getElementById('clear-history-btn').addEventListener('click', async () => {
          await clearHistoryDb();
          updateHistoryIndicator();
        });
      } catch (e) {
        console.warn('[history] Failed to read IndexedDB for indicator:', e);
      }
    }

    // ─── DACC-04: On page load, check /history for server-stored CSVs and import ──
    // any dates not already in IndexedDB. Runs silently — no toasts.
    // Only runs when app is served via server.py (http: origin). No-op on file://.
    async function loadHistoryFromServer() {
      if (window.location.protocol === 'file:') return; // file:// has no server
      try {
        const resp = await fetch('/history', { signal: AbortSignal.timeout(3000) });
        if (!resp.ok) return; // server running but /history not available — skip
        const serverDates = await resp.json(); // string[] of YYYYMMDD
        if (!Array.isArray(serverDates) || serverDates.length === 0) return;

        // Only import dates not already in IndexedDB
        const existing = await getAllHistoryDays();
        const existingSet = new Set(existing.map(r => r.date));
        const toImport = serverDates.filter(d => !existingSet.has(d));
        if (toImport.length === 0) return;

        let imported = 0;
        for (const date of toImport) {
          try {
            const csvResp = await fetch('/history/' + date + '.csv', { signal: AbortSignal.timeout(5000) });
            if (!csvResp.ok) continue;
            const buffer = await csvResp.arrayBuffer();
            const csvString = new TextDecoder('windows-1252').decode(buffer);
            await upsertHistoryDay(date, csvString);
            imported++;
          } catch (e) {
            console.warn('[history] Failed to import ' + date + ':', e);
          }
        }
        if (imported > 0) {
          await updateHistoryIndicator();
          console.log('[history] Imported ' + imported + ' day(s) from server history');
        }
      } catch (e) {
        // Silently swallow — /history may not be available in older server.py versions
        console.debug('[history] loadHistoryFromServer skipped:', e.message);
      }
    }

    // ─── Phase 9: Statistics Panel (AGGR-01, AGGR-02) ─────────────
    async function loadStatsPanel() {
      const panel = document.getElementById('stats-panel');
      panel.innerHTML = '<div class="stats-empty">Loading statistics...</div>';

      // file:// fallback: /stats endpoint is unavailable
      if (window.location.protocol === 'file:') {
        panel.innerHTML = '<div class="stats-empty">Statistics require server.py.<br>Double-click start.bat or run: python server.py</div>';
        return;
      }

      // Sync IndexedDB days to server (browser data the server may not have yet)
      try {
        const serverDatesArr = await fetch('/history', { signal: AbortSignal.timeout(3000) })
          .then(function(r) { return r.ok ? r.json() : []; })
          .catch(function() { return []; });
        const serverSet = new Set(serverDatesArr);
        const localDays = await getAllHistoryDays().catch(function() { return []; });
        for (const day of localDays) {
          if (!serverSet.has(day.date)) {
            try {
              await fetch('/history?date=' + day.date, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                body: day.csvString,
                signal: AbortSignal.timeout(10000)
              });
            } catch (e) { /* ignore individual upload failures */ }
          }
        }
      } catch (e) { /* ignore sync errors — stats will still show what server has */ }

      let statsData;
      try {
        const resp = await fetch('/stats', { signal: AbortSignal.timeout(5000) });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        statsData = await resp.json();
      } catch (e) {
        panel.innerHTML = '<div class="stats-empty">Could not load statistics. Is server.py running?</div>';
        return;
      }

      if (!statsData.days || statsData.days.length === 0) {
        panel.innerHTML = '<div class="stats-empty">No statistics yet \u2014 fetch or upload at least one day\'s CSV to begin.</div>';
        return;
      }

      const days = statsData.days;
      const trend = statsData.trend;

      // Summary section
      const totalStarts = days.reduce((s, d) => s + (d.starts || 0), 0);
      const totalRuntime = days.reduce((s, d) => s + (d.runtime_minutes || 0), 0);
      const runtimeHours = (totalRuntime / 60).toFixed(1);
      const trendLabel = trend.label || 'N/A';
      const periodStart = formatHistoryDate(days[0].date);
      const periodEnd   = formatHistoryDate(days[days.length - 1].date);
      const periodStr   = days.length === 1 ? periodStart : periodStart + ' \u2013 ' + periodEnd;

      const live = statsData.live || {};

      // Storage display: "1573 kg (23%)" with low-stock warning colour
      let storageStr = '\u2014';
      let storageStyle = '';
      if (live.storage_kg !== null && live.storage_kg !== undefined) {
        storageStr = live.storage_kg + ' kg';
        if (live.storage_max) {
          storageStr += ' (' + Math.round(live.storage_kg / live.storage_max * 100) + '%)';
        }
        if (live.storage_min !== null && live.storage_kg <= live.storage_min) {
          storageStyle = 'color:var(--red,#ef4444);';
        }
      }

      const daysRemainingStr = (live.days_remaining !== null && live.days_remaining !== undefined)
        ? live.days_remaining + ' days' : '\u2014';
      const avgRuntimeStr = (live.avg_runtime_min !== null && live.avg_runtime_min !== undefined)
        ? live.avg_runtime_min + ' min' : '\u2014';

      const summaryHtml = '' +
        '<div class="stats-summary">' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Period</span><span class="stats-summary-value" style="font-size:13px;">' + periodStr + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Days stored</span><span class="stats-summary-value">' + statsData.total_days + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Total starts</span><span class="stats-summary-value">' + totalStarts + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Total runtime</span><span class="stats-summary-value">' + runtimeHours + ' h</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Avg run duration</span><span class="stats-summary-value">' + avgRuntimeStr + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Start trend</span><span class="stats-summary-value" style="font-size:14px;">' + trendLabel + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Storage</span><span class="stats-summary-value" style="' + storageStyle + '">' + storageStr + '</span></div>' +
        '<div class="stats-summary-item"><span class="stats-summary-label">Fuel remaining</span><span class="stats-summary-value">' + daysRemainingStr + '</span></div>' +
        '</div>';

      // Per-day table
      const fmtNum = (v, dec) => { dec = dec === undefined ? 1 : dec; return (v !== null && v !== undefined) ? Number(v).toFixed(dec) : '-'; };
      const rowsHtml = days.map(function(d) {
        const dateLabel = formatHistoryDate(d.date);
        const partialBadge = d.is_partial ? '<span class="stats-partial-badge">*partial</span>' : '';
        const startsVal = (d.starts !== null && d.starts !== undefined) ? d.starts : '-';
        const runtimeVal = d.runtime_minutes ? fmtNum(d.runtime_minutes / 60) + ' h' : '-';
        const pelletVal = (d.pellet_kg !== null && d.pellet_kg !== undefined) ? fmtNum(d.pellet_kg) + ' kg' : 'N/A';
        const outdoorVal = (d.avg_outdoor_temp !== null && d.avg_outdoor_temp !== undefined) ? fmtNum(d.avg_outdoor_temp) + ' C' : '-';
        return '<tr class="stats-row" data-date="' + d.date + '">' +
               '<td>' + dateLabel + partialBadge + '</td>' +
               '<td>' + startsVal + '</td>' +
               '<td>' + runtimeVal + '</td>' +
               '<td>' + pelletVal + '</td>' +
               '<td>' + outdoorVal + '</td>' +
               '</tr>';
      }).join('');

      const tableHtml = '<div class="stats-table-wrap"><table class="stats-table">' +
        '<thead><tr><th>Date</th><th>Starts</th><th>Runtime</th><th>Consumption</th><th>Avg Outdoor</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table></div>' +
        '<div style="margin-top:8px; font-size:11px; color:var(--text-3);">* Partial day (less than 20h of data) \u2014 excluded from trend calculation</div>';

      panel.innerHTML = summaryHtml + tableHtml;

      // Row click: load that day from IndexedDB into chart
      panel.querySelectorAll('tr.stats-row').forEach(function(row) {
        row.addEventListener('click', async function() {
          const date = row.dataset.date;
          try {
            const allDays = await getAllHistoryDays();
            const record = allDays.find(function(r) { return r.date === date; });
            if (!record) {
              showToast('Day ' + formatHistoryDate(date) + ' not in local history \u2014 fetch it first.', 'warning');
              return;
            }
            showStatsPanel(false);
            await onCsvStringAccepted(record.csvString, formatHistoryDate(date) + '.csv', date);
          } catch (e) {
            showToast('Failed to load day: ' + e.message, 'error');
          }
        });
      });
    }

    // ─── Init ─────────────────────────────────────────────────────
    loadSettings();
    loadBaseline();   // BASE-01/02: load stored baseline on startup
    loadAiSettings(); // AICO-01: load stored AI backend settings on startup
    if (_aiSettings.credential) showRunAnalysisBtn(); // AICO-04: show button if credential already saved
    initOnboardingPrompt();
    initBaselinePrompt();
    // Show fetch controls if heater settings were previously saved (v1.1 Phase 6)
    if (_settings.ip && _settings.password) {
      showFetchControls();
      // Push existing localStorage settings to server on startup (so /stats live data works)
      if (window.location.protocol !== 'file:') {
        fetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: _settings.ip, port: _settings.port, password: _settings.password }),
        }).catch(function() {});
      }
    }
    // DACC-02: Initialize history indicator on page load
    updateHistoryIndicator();
    // DACC-04: Import server-stored history (from server.py --schedule) silently on startup
    loadHistoryFromServer();
    // Auto-load most recent day from IndexedDB on startup (skip drop zone if history exists)
    getAllHistoryDays().then(function(days) {
      if (!days || days.length === 0) {
        setStatus('Ready — drop an OekoFEN CSV file to begin');
        return;
      }
      const latest = days[days.length - 1];
      onCsvStringAccepted(latest.csvString, formatHistoryDate(latest.date) + '.csv', latest.date);
    }).catch(function() {
      setStatus('Ready — drop an OekoFEN CSV file to begin');
    });
  </script>
</body>
</html>
