    // Phase 11: Escape HTML special characters to prevent XSS from AI response content
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Phase 11: Render analysis panel content from _lastAnalysis
    function renderAnalysisPanel() {
      const panel = document.getElementById('analysis-panel');
      if (!panel) return;

      // Empty state: no analysis run yet
      if (!_lastAnalysis) {
        panel.innerHTML = '<div class="anls-empty">No analysis yet &mdash; click <strong>Run Analysis</strong> to generate recommendations.</div>';
        return;
      }

      const recs    = _lastAnalysis.recommendations   || [];
      const alerts  = _lastAnalysis.maintenance_alerts || [];
      const daysN   = _lastAnalysis.days_analyzed      || 0;
      const runAt   = _lastAnalysis.analyzed_at
                        ? new Date(_lastAnalysis.analyzed_at).toLocaleString()
                        : 'Unknown';

      // ── Header metadata ───────────────────────────────────────
      var html = '<div class="anls-header">';
      html += '<div class="anls-meta-item"><span class="anls-meta-label">Last run</span><span class="anls-meta-value">' + runAt + '</span></div>';
      html += '<div class="anls-meta-item"><span class="anls-meta-label">Days analyzed</span><span class="anls-meta-value">' + daysN + '</span></div>';
      html += '</div>';

      // ── Recommendations ────────────────────────────────────────
      html += '<div class="anls-section-title">Recommendations</div>';
      if (recs.length === 0) {
        html += '<div class="anls-empty" style="padding:20px 0;">No recommendations &mdash; heater is operating normally.</div>';
      } else {
        html += '<div class="anls-rec-list">';
        recs.forEach(function(rec) {
          html += '<div class="rec-card">';
          html += '<div class="rec-card-title">' + escHtml(rec.title || '') + '</div>';
          html += '<div class="rec-card-explanation">' + escHtml(rec.explanation || '') + '</div>';
          // Only show setting row if at least setting_name is present
          if (rec.setting_name) {
            html += '<div class="rec-card-setting">';
            html += '<span class="rec-card-setting-label">Setting</span>';
            html += '<span class="rec-card-setting-name">' + escHtml(rec.setting_name) + '</span>';
            if (rec.suggested_value) {
              html += '<span class="rec-card-arrow">&rarr;</span>';
              html += '<span class="rec-card-setting-value">' + escHtml(rec.suggested_value) + '</span>';
            }
            html += '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
      }

      // ── Maintenance alerts ─────────────────────────────────────
      html += '<div class="anls-section-title" style="margin-top:8px;">Maintenance Alerts</div>';
      if (alerts.length === 0) {
        html += '<div class="anls-empty" style="padding:20px 0;">No maintenance alerts detected.</div>';
      } else {
        html += '<div class="anls-alert-list">';
        alerts.forEach(function(alert) {
          html += '<div class="alert-card">';
          html += '<div class="alert-card-title">' + escHtml(alert.title || '') + '</div>';
          html += '<div class="alert-card-detail">' + escHtml(alert.detail || '') + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      panel.innerHTML = html;
    }

    // ─── Navigation guard ─────────────────────────────────────────
    // Prevents browser from navigating away when user drops a file
    // anywhere on the page (outside the drop zone).
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) handleFileDrop(file);
    });

    // ─── Drop zone drag handlers ──────────────────────────────────
    // Drag depth counter prevents visual flicker when cursor moves
    // between child elements inside the drop zone.
    let dragDepth = 0;
    const dropZone = document.getElementById('drop-zone');

    dropZone.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dragDepth--;
      if (dragDepth === 0) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFileDrop(file);
    });

    // ─── File type validation ─────────────────────────────────────
    function handleFileDrop(file) {
      const name = file.name.toLowerCase();
      if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
        showToast('This is a graph image. Drop the CSV file (touch_*.csv) instead', 'warning');
        return;
      }
      if (!name.endsWith('.csv')) {
        showToast('Only CSV files are accepted. Please select a touch_*.csv file.', 'error');
        return;
      }
      onFileAccepted(file);
    }

    // ─── CSV Parse and Normalize Pipeline (Plan 03) ───────────────

    // STEP 1 — Read as ArrayBuffer, decode as Windows-1252
    // PARS-03: The real OekoFEN CSV has NO BOM and is ISO-8859-1 encoded.
    // Using TextDecoder('windows-1252') correctly handles Latin-1 extended chars
    // (°, ä, ö, ü). UTF-8 would produce mojibake (Â°C instead of °C).
    async function readFileAsText(file) {
      const arrayBuffer = await file.arrayBuffer();
      return new TextDecoder('windows-1252').decode(arrayBuffer);
    }

    // STEP 2 — PapaParse with semicolon delimiter
    // PARS-01: semicolon delimiter
    function parseCSVString(csvString) {
      return Papa.parse(csvString, {
        delimiter: ';',
        header: true,
        skipEmptyLines: true,
      });
    }

    // STEP 3 — Normalize headers (trim + drop empty trailing column)
    // Trailing semicolon creates a column with key "" or " " — filter it out.
    // Column names also have trailing spaces — trim all.
    // The heater's HTTP API substitutes '?' for '°' in unit brackets — restore it.
    function normalizeHeaders(papaResult) {
      const rawFields = papaResult.meta.fields;
      // Normalize: trim whitespace, then replace '?' with '°' inside [...] brackets.
      const normalize = f => f.trim().replace(/\[([^\]]*)\]/g, (m, u) => '[' + u.replace(/\?/g, '°') + ']');
      const goodFields = rawFields
        .map(normalize)
        .filter(f => f !== '');

      // Rebuild data array with normalized keys, dropping the empty column
      const rows = papaResult.data.map(row => {
        const normalized = {};
        rawFields.forEach(rawKey => {
          const key = normalize(rawKey);
          if (key !== '') {
            normalized[key] = row[rawKey];
          }
        });
        return normalized;
      });

      return { fields: goodFields, rows };
    }

    // STEP 4 — Parse German decimals
    // PARS-02: German locale uses comma as decimal separator.
    // parseFloat("1,4") returns 1 in Chrome (stops at comma).
    // Must replace comma with dot before parsing.
    // Returns null for empty/whitespace strings (gap in chart data).
    function parseGermanFloat(str) {
      if (!str || str.trim() === '') return null;
      const val = parseFloat(str.trim().replace(',', '.'));
      return isNaN(val) ? null : val;
    }

    // Classify whether a raw value is an integer (no comma, no dot, digits only)
    function parseGermanValue(str) {
      if (!str || str.trim() === '') return null;
      const trimmed = str.trim();
      // Integer check: digits only, possibly negative (like -2147483648)
      if (/^-?\d+$/.test(trimmed)) {
        const intVal = parseInt(trimmed, 10);
        return isNaN(intVal) ? null : intVal;
      }
      // Float with German decimal comma
      return parseGermanFloat(trimmed);
    }

    // STEP 5 — Build Unix timestamps from Datum + Zeit columns
    // PARS-04: Timezone-safe timestamp reconstruction.
    // Always parse from row's Datum and Zeit values, never from filename.
    // Last row may cross midnight to the next calendar day.
    // Returns Unix seconds (not milliseconds — uPlot uses seconds).
    function buildUnixTimestamp(datumStr, zeitStr) {
      // Datum format: DD.MM.YYYY (e.g., "16.02.2026")
      // Zeit format:  HH:MM:SS  (e.g., "00:02:44")
      const [day, month, year] = datumStr.trim().split('.');
      const [hour, min, sec] = zeitStr.trim().split(':');
      // Date.UTC avoids local timezone offset — result is always UTC
      return Date.UTC(+year, +month - 1, +day, +hour, +min, +sec) / 1000;
    }

    // STEP 6 — Column header parsing and group classification
    // PARS-05: Parse unit from column name like "AT [°C]" or "HK1 VL Ist[°C]"
    // Returns { displayName, unit }
    function parseColumnHeader(rawName) {
      // Match optional space before bracket: "AT [°C]" or "HK1 VL Ist[°C]"
      const match = rawName.match(/^(.+?)\s*\[([^\]]+)\]\s*$/);
      if (match) {
        return { displayName: rawName, unit: match[2].trim() };
      }
      return { displayName: rawName, unit: null };
    }

    // Per CONTEXT.md group rules (LOCKED USER DECISION):
    // Boiler: AT, ATakt, KT Ist, KT Soll, BR, Sperrzeit, PE1_BR1
    // Heating Circuit (HK1): starts with HK1
    // Hot Water (WW1): starts with WW1
    // Buffer (PU1): starts with PU1
    // Pellet Unit (PE1): starts with PE1 (kept as one group — NOT split)
    // IGNORED: Fehler1, Fehler2, Fehler3, Zubrp1 Pumpe, '' (empty)
    const IGNORED_COLUMNS = new Set(['Fehler1', 'Fehler2', 'Fehler3', 'Zubrp1 Pumpe']);
    const BINARY_COLUMNS = new Set(['BR', 'Sperrzeit']);

    function classifyColumn(rawName) {
      // Extract just the name part (without unit) for group matching
      const namePart = rawName.match(/^(.+?)\s*(?:\[|$)/)?.[1]?.trim() ?? rawName;

      if (IGNORED_COLUMNS.has(namePart)) return null; // excluded
      if (namePart === 'Datum' || namePart === 'Zeit') return 'timestamp'; // X-axis

      let group;
      if (namePart.startsWith('HK1')) group = 'Heating Circuit (HK1)';
      else if (namePart.startsWith('WW1')) group = 'Hot Water (WW1)';
      else if (namePart.startsWith('PU1')) group = 'Buffer (PU1)';
      else if (namePart.startsWith('PE1')) group = 'Pellet Unit (PE1)';
      else group = 'Boiler'; // AT, ATakt, KT Ist/Soll, BR, Sperrzeit, PE1_BR1, others

      const type = BINARY_COLUMNS.has(namePart) ? 'discrete' : 'continuous';
      return { group, type };
    }

    // ─── Chart Series Builder (Phase 2) ───────────────────────────

    const DEFAULT_SERIES = [
      'AT [\u00b0C]',            // Outside air temperature (Aussentemperatur)
      'KT Ist [\u00b0C]',        // Boiler actual temperature (Kesseltemperatur)
      'HK1 VL Ist[\u00b0C]',     // HK1 flow temperature actual
      'HK1 RT Ist[\u00b0C]',     // HK1 return temperature actual (RT = Rücklauftemperatur)
      'PU1 TPO Ist[\u00b0C]',    // Buffer upper temperature (TPO = top sensor)
      'PU1 TPM Ist[\u00b0C]',    // Buffer middle temperature (TPM = middle sensor)
      'PE1 KT[\u00b0C]',          // PE1 boiler temperature (KT = Kesseltemperatur)
      'PE1 FRT Ist[\u00b0C]',     // PE1 firebox temperature actual (FRT = Feuerraumtemperatur)
      'BR',                       // Burner running (binary 0/1)
    ];

    const GROUP_COLORS = {
      'Boiler':                { continuous: '#4fc3f7', binary: 'rgba(255, 159, 10, 0.30)' },
      'Heating Circuit (HK1)': { continuous: '#ff8a65' },
      'Hot Water (WW1)':       { continuous: '#ce93d8' },
      'Buffer (PU1)':          { continuous: '#81c784' },
      'Pellet Unit (PE1)':     { continuous: '#ffca28' },
    };

    const SERIES_COLOR_OVERRIDES = {
      'AT [\u00b0C]':         '#80deea',  // teal — stands out as "outside air"
      'KT Ist [\u00b0C]':     '#ef5350',  // red — boiler temp is most critical
      'HK1 RT Ist[\u00b0C]':  '#ff7043',  // darker orange to separate from VL
      'PU1 TPM Ist[\u00b0C]': '#4caf50',  // darker green to separate from upper sensor
    };

    function buildChartData(dataModel, seriesNames) {
      // uPlot data format: [ timestamps[], col1[], col2[], ... ]
      // First element is always the shared X-axis timestamps array.
      const timestamps = dataModel.timestamps;

      // Resolve columns by rawName — skip any that don't exist in the data model
      const resolvedCols = [];
      for (const rawName of seriesNames) {
        const col = dataModel.columns.find(c => c.rawName === rawName);
        if (col) resolvedCols.push(col);
        else console.warn('[buildChartData] rawName not found in dataModel:', rawName);
      }

      // Build columnar data arrays
      const data = [timestamps];
      for (const col of resolvedCols) {
        // uPlot treats NaN as a gap — convert null to NaN
        const arr = col.data.map(v => (v === null ? NaN : v));
        data.push(arr);
      }

      // Build series opts — first entry is X-axis placeholder (empty object)
      const series = [{}];
      for (const col of resolvedCols) {
        const isBinary = col.type === 'discrete';
        const groupColors = GROUP_COLORS[col.group] || { continuous: '#e0e0e0' };
        const stroke = SERIES_COLOR_OVERRIDES[col.rawName] ||
                       (isBinary ? (groupColors.binary || 'rgba(255,159,10,0.30)') : groupColors.continuous) ||
                       '#e0e0e0';

        if (isBinary) {
          // Binary series: filled band on the right 'binary' axis (fixed 0-1 scale)
          // fill: stroke uses the rgba transparency to allow temperature lines to show through
          // paths.stepped renders as a step function (0 or 1, no interpolation)
          series.push({
            label:    col.displayName,
            scale:    'binary',
            stroke:   stroke,
            fill:     stroke,
            width:    0,          // no line stroke — fill only
            spanGaps: false,
            paths:    uPlot.paths.stepped({ align: 1 }),
            points:   { show: false },
          });
        } else {
          series.push({
            label:    col.displayName,
            scale:    'y',
            stroke:   stroke,
            width:    1.5,
            spanGaps: false,
            points:   { show: false },
          });
        }
      }

      return { data, series, resolvedCols };
    }

    // ─── Wheel Zoom Plugin (NAVG-02) ──────────────────────────────
    // Source pattern: uPlot official zoom-wheel.html demo
    // Cursor-centered: the timestamp under the cursor stays fixed as range contracts/expands
    function wheelZoomPlugin(opts) {
      opts = opts || {};
      const factor = opts.factor || 0.75;   // zoom-in shrinks range by this factor per scroll tick

      return {
        hooks: {
          ready: [function(u) {
            // Capture full data range once for clamping
            const xMin = u.data[0][0];
            const xMax = u.data[0][u.data[0].length - 1];
            const MIN_RANGE = 300;                // 5 minutes in seconds (min zoom level)
            const MAX_RANGE = xMax - xMin;        // full day range (max zoom level)

            u.over.addEventListener('wheel', function(e) {
              e.preventDefault();   // prevent page scroll — REQUIRES passive:false (see registration below)

              // u.cursor.left is the pixel position within u.over (already chart-relative, no rect needed)
              const cursorLeft = u.cursor.left;
              if (cursorLeft < 0) return;   // cursor outside chart area

              const xVal    = u.posToVal(cursorLeft, 'x');   // data value under cursor
              const oxRange = u.scales.x.max - u.scales.x.min;
              const leftPct = cursorLeft / u.over.clientWidth;  // fraction from left edge

              // deltaY < 0 = scroll up = zoom in (shrink range); deltaY > 0 = zoom out (expand range)
              let nxRange = e.deltaY < 0 ? oxRange * factor : oxRange / factor;

              // Clamp to zoom limits
              nxRange = Math.max(MIN_RANGE, Math.min(MAX_RANGE, nxRange));

              // Cursor-centered: xVal stays at leftPct fraction of new range
              let nxMin = xVal - leftPct * nxRange;
              let nxMax = nxMin + nxRange;

              // Clamp to data bounds — shift range rather than truncating it
              if (nxMin < xMin) { nxMin = xMin; nxMax = nxMin + nxRange; }
              if (nxMax > xMax) { nxMax = xMax; nxMin = nxMax - nxRange; }
              // Final clamp to prevent overshoot when both bounds are hit
              nxMin = Math.max(nxMin, xMin);
              nxMax = Math.min(nxMax, xMax);

              u.batch(function() {
                u.setScale('x', { min: nxMin, max: nxMax });
              });
            }, { passive: false });   // passive:false is REQUIRED — without it, e.preventDefault() throws and page scrolls
          }],
        },
      };
    }

    // ─── Tooltip Plugin (NAVG-04) ─────────────────────────────────
    // Source pattern: uPlot official tooltips.html demo — adapted
    // Shows HH:MM time header + raw values of all visible series at cursor position.
    // Left/right flip keeps tooltip inside chart boundary.
    function tooltipPlugin() {
      let tooltip;
      const OFFSET = 12;   // px gap between cursor line and tooltip edge

      function init(u) {
        tooltip = document.createElement('div');
        tooltip.id = 'chart-tooltip';
        u.over.appendChild(tooltip);

        // Hide on mouse leave, show on mouse enter
        u.over.addEventListener('mouseleave', function() {
          tooltip.style.display = 'none';
        });
        u.over.addEventListener('mouseenter', function() {
          // Use 'block' not '' — the CSS rule sets display:none so clearing inline style
          // would re-apply the CSS rule, keeping the tooltip hidden.
          if (tooltip.innerHTML) tooltip.style.display = 'block';
        });
      }

      function setCursor(u) {
        const idx = u.cursor.idx;
        if (idx == null) { tooltip.style.display = 'none'; return; }

        const left = u.cursor.left;
        const top  = u.cursor.top;

        // Build time header: HH:MM in UTC (matching the X-axis format)
        const ts = u.data[0][idx];
        const d  = new Date(ts * 1000);
        const hh = String(d.getUTCHours()).padStart(2, '0');
        const mm = String(d.getUTCMinutes()).padStart(2, '0');

        let html = '<div class="tt-time">' + hh + ':' + mm + '</div>';

        // One row per visible series — skip series[0] (X-axis placeholder)
        for (let i = 1; i < u.series.length; i++) {
          const s = u.series[i];
          if (s.show === false) continue;   // skip hidden series (Phase 4 may hide some)

          const rawVal = u.data[i][idx];
          // Display raw value from CSV — no forced rounding (per CONTEXT.md)
          const disp = (rawVal == null || isNaN(rawVal)) ? '\u2014' : rawVal;
          // s.stroke may be a function or string — resolve to string for the swatch
          const color = typeof s.stroke === 'function' ? s.stroke(u, i) : (s.stroke || '#e0e0e0');

          html += '<div class="tt-row">' +
            '<span class="tt-swatch" style="background:' + color + '"></span>' +
            '<span class="tt-label">' + s.label + '</span>' +
            '<span class="tt-val">' + disp + '</span>' +
            '</div>';
        }

        tooltip.innerHTML = html;
        // Use 'block' not '' — CSS rule sets display:none; clearing inline style
        // would re-apply the CSS rule and keep tooltip hidden.
        tooltip.style.display = 'block';

        // Left/right flip: if tooltip would overflow right edge, show it to the left of cursor
        const chartW = u.over.clientWidth;
        const ttW    = tooltip.offsetWidth || 180;
        const flipX  = (left + ttW + OFFSET) > chartW;
        tooltip.style.left = (flipX ? (left - ttW - OFFSET) : (left + OFFSET)) + 'px';

        // Vertical position: keep tooltip fully inside chart (don't go above 0 or below bottom)
        const chartH = u.over.clientHeight;
        const ttH    = tooltip.offsetHeight || 150;
        tooltip.style.top = Math.min(Math.max(0, top - 20), Math.max(0, chartH - ttH)) + 'px';
      }

      return {
        hooks: {
          init:      [init],
          setCursor: [setCursor],
        },
      };
    }

    // ─── Minimap Overview (NAVG-05) ───────────────────────────────
    // Secondary uPlot instance at 72px height showing full day with zoom region highlighted.
    // Bidirectional sync: main chart's setScale hook calls minimap.updateSelection(),
    // minimap's setSelect hook calls AppState.chart.setScale() — infinite loop prevented
    // by passing false as second arg to minimap.setSelect().
    function createMinimap(data, series) {
      const container = document.getElementById('minimap-area');
      if (!container) return null;

      // Simplified series for minimap: reuse same series opts but with thinner strokes
      // to reduce visual noise in 72px height. Only show a subset of key series.
      // Per research: showing all 9 series at full width produces an indistinct mass.
      // Solution: use the same series array but reduce width to 0.5 for continuous, 0 for binary.
      const minimapSeries = series.map(function(s, i) {
        if (i === 0) return s;   // X-axis placeholder — unchanged
        if (s.scale === 'binary') {
          // Binary (BR burner state): keep as filled band but thinner
          return Object.assign({}, s, { width: 0 });
        }
        // Continuous: thin stroke, no fill
        return Object.assign({}, s, { width: 0.5 });
      });

      const minimapOpts = {
        width:  container.clientWidth,
        height: container.clientHeight,   // 72px set by CSS --minimap-height

        series: minimapSeries,

        legend: { show: false },           // no legend in minimap

        axes: [
          { show: false },                 // hide X axis labels (too small at 72px)
          { show: false },                 // hide left Y axis
          { show: false },                 // hide right binary axis
        ],

        cursor: {
          // show:false disables ALL cursor tracking including drag — use show:true
          // and hide the crosshair lines via CSS instead (see #minimap-area .u-cursor rules).
          show: true,
          x:    true,
          y:    false,
          drag: {
            setScale: false,               // minimap drag does NOT auto-zoom minimap's own scale
            x: true,
            y: false,
          },
        },

        select: {
          show: true,                      // show the highlighted zoom region overlay
        },

        scales: {
          x:      {},
          y:      { auto: true },
          binary: { range: [0, 1] },
        },

        padding: [2, 0, 2, 0],

        hooks: {
          setSelect: [function(uMinimap) {
            // Fires when user drags in minimap to select a new range
            // Convert pixel selection to timestamps and zoom main chart
            const newMin = uMinimap.posToVal(uMinimap.select.left, 'x');
            const newMax = uMinimap.posToVal(uMinimap.select.left + uMinimap.select.width, 'x');
            if (AppState.chart && newMin < newMax) {
              AppState.chart.setScale('x', { min: newMin, max: newMax });
            }
          }],
        },
      };

      const uMinimap = new uPlot(minimapOpts, data, container);

      // updateSelection: called by AppState.onZoomChange when main chart zoom changes.
      // Draws the highlight overlay showing the current zoom window on the minimap.
      // CRITICAL: pass false as second arg to setSelect to prevent minimap's setSelect
      // hook from firing (which would call AppState.chart.setScale again — infinite loop).
      function updateSelection(minTs, maxTs) {
        if (!uMinimap) return;

        // Clamp to minimap's own x range to avoid setSelect with out-of-bounds values
        const dataMin = uMinimap.data[0][0];
        const dataMax = uMinimap.data[0][uMinimap.data[0].length - 1];
        const clampedMin = Math.max(minTs, dataMin);
        const clampedMax = Math.min(maxTs, dataMax);

        const left   = Math.round(uMinimap.valToPos(clampedMin, 'x'));
        const right  = Math.round(uMinimap.valToPos(clampedMax, 'x'));
        const width  = Math.max(0, right - left);
        // height in CSS pixels (bbox.height is in physical pixels / devicePixelRatio)
        const height = uMinimap.bbox.height / devicePixelRatio;

        uMinimap.setSelect({ left: left, width: width, height: height, top: 0 }, false);
      }

      return { instance: uMinimap, updateSelection: updateSelection };
    }

    // ─── Chart Lifecycle (Phase 3) ────────────────────────────────
    function updateResetButtonVisibility(u) {
      const btn = document.getElementById('reset-zoom-btn');
      if (!btn || !u) return;
      const dataMin = u.data[0][0];
      const dataMax = u.data[0][u.data[0].length - 1];
      const min = u.scales.x.min;
      const max = u.scales.x.max;
      // 1-second tolerance to avoid float rounding causing button to show at full range
      const isFullRange = (min <= dataMin + 1) && (max >= dataMax - 1);
      btn.style.display = isFullRange ? 'none' : '';
    }

    function destroyChart() {
      destroyViewTabs();        // Phase 4.1 cleanup — MUST come before chart destroy
      unwireLegendClicks();     // Phase 4.2 cleanup — must be before chart.destroy()
      closePickerModal();       // Phase 4.3 — removes stale modal on file reload
      if (AppState.chart) {
        AppState.chart.destroy();
        AppState.chart = null;
      }
      document.getElementById('chart-area').innerHTML = '';
      AppState.zoomRange = null;
      AppState.onZoomChange = null;
      if (AppState.minimap) {
        AppState.minimap.instance.destroy();
        AppState.minimap = null;
      }
      document.getElementById('minimap-area').innerHTML = '';
    }

    function createChart() {
      destroyChart();

      const dataModel = AppState.dataModel;
      // Build chart with ALL dataModel columns so any parameter can be shown/hidden via the
      // picker without recreating the chart. DEFAULT_SERIES (those present in the file) come
      // first and are visible; all other columns follow and are initially hidden.
      const defaultSet = new Set(DEFAULT_SERIES.filter(rn =>
        dataModel.columns.some(c => c.rawName === rn)));
      const allRawNames = [
        ...DEFAULT_SERIES.filter(rn => dataModel.columns.some(c => c.rawName === rn)),
        ...dataModel.columns.filter(c => !defaultSet.has(c.rawName)).map(c => c.rawName),
      ];
      const { data, series } = buildChartData(dataModel, allRawNames);
      // Mark non-DEFAULT series as initially hidden
      for (let i = 1; i < series.length; i++) {
        if (!defaultSet.has(series[i].label)) series[i].show = false;
      }

      // Format chart title as DD.MM.YYYY from AppState.fileDate (YYYYMMDD) or first timestamp
      let chartTitle = '';
      if (AppState.fileDate && AppState.fileDate.length === 8) {
        const fd = AppState.fileDate;
        chartTitle = fd.slice(6, 8) + '.' + fd.slice(4, 6) + '.' + fd.slice(0, 4);
      } else if (dataModel.timestamps.length > 0) {
        const d = new Date(dataModel.timestamps[0] * 1000);
        chartTitle = String(d.getUTCDate()).padStart(2, '0') + '.' +
                     String(d.getUTCMonth() + 1).padStart(2, '0') + '.' +
                     d.getUTCFullYear();
      }

      const container = document.getElementById('chart-area');
      const opts = {
        title:  chartTitle,
        width:  container.clientWidth,
        height: container.clientHeight,
        series,

        axes: [
          // X-axis: Unix seconds formatted as HH:MM in UTC
          {
            stroke: 'rgba(22, 25, 43, 0.45)',
            grid:   { stroke: 'rgba(22, 25, 43, 0.07)', width: 1 },
            ticks:  { stroke: 'rgba(22, 25, 43, 0.10)', width: 1 },
            // Minimum tick increment: 60 seconds (1 minute).
            // Prevents label crowding at high zoom levels — ticks will never be
            // placed more frequently than once per minute.
            incrs: [60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 43200, 86400],
            values: (self, ticks) => ticks.map(t => {
              const d = new Date(t * 1000);
              return String(d.getUTCHours()).padStart(2, '0') + ':' +
                     String(d.getUTCMinutes()).padStart(2, '0');
            }),
          },
          // Left Y-axis: continuous series (temperatures, percentages) — auto-scale
          {
            scale:  'y',
            side:   3,
            stroke: 'rgba(22, 25, 43, 0.45)',
            grid:   { stroke: 'rgba(22, 25, 43, 0.07)', width: 1 },
            ticks:  { stroke: 'rgba(22, 25, 43, 0.10)', width: 1 },
            values: (self, ticks) => ticks.map(v => v.toFixed(0)),
            size:   45,
          },
          // Right Y-axis: binary/discrete series — fixed 0-1 range
          {
            scale:  'binary',
            side:   1,
            stroke: 'rgba(22, 25, 43, 0.45)',
            grid:   { show: false },
            ticks:  { show: false },
            values: (self, ticks) => ticks.map(v => (v === 1 ? 'On' : v === 0 ? 'Off' : '')),
            size:   35,
          },
        ],

        scales: {
          x:      {},
          y:      { auto: true },    // auto-scales to visible continuous series
          binary: { range: [0, 1] }, // fixed for discrete 0/1 states
        },

        legend: {
          show: true,
          live: false,  // Phase 3 will handle live cursor value display
        },

        cursor: {
          show: true,
          x: true,
          y: false,
          drag: {
            // setScale:false — uPlot's native drag zoom bypasses any setScale hook correction
            // (uPlot clears Kl[] at the end of its own qn() render cycle, discarding any
            // in-hook setScale calls). We handle the zoom manually via a mouseup listener
            // so we can pass pre-clamped values directly to setScale().
            setScale: false,
            x: true,
            y: false,
            dist: 3,          // minimum drag distance in px before zoom activates
          },
        },

        select: { show: true },   // shows selection rectangle during drag

        hooks: {
          setScale: [(u, scaleKey) => {
            if (scaleKey !== 'x') return;
            const min = u.scales.x.min;
            const max = u.scales.x.max;
            AppState.zoomRange = { min, max };
            if (AppState.onZoomChange) AppState.onZoomChange(min, max);
            updateResetButtonVisibility(u);
          }],
        },

        plugins: [
          wheelZoomPlugin({ factor: 0.75 }),
          tooltipPlugin(),
        ],

        // Reserve minimap space: chart height fills container (Phase 3 will add minimap below)
        padding: [10, 0, 0, 0],
      };

      AppState.chart = new uPlot(opts, data, container);
      AppState.chartSeries = series;

      // Manual drag-zoom with 5-minute floor. cursor.drag.setScale:false disables uPlot's
      // native zoom-on-drag so we control setScale() directly with pre-clamped values.
      AppState.chart.over.addEventListener('mouseup', () => {
        const u = AppState.chart;
        if (!u) return;
        const { left, width } = u.select;
        if (width <= 0) return;
        const MIN_RANGE = 300; // 5 minutes in seconds
        const dataMin = u.data[0][0];
        const dataMax = u.data[0][u.data[0].length - 1];
        let newMin = u.posToVal(left, 'x');
        let newMax = u.posToVal(left + width, 'x');
        if (newMax - newMin < MIN_RANGE) {
          const mid = (newMin + newMax) / 2;
          newMin = mid - MIN_RANGE / 2;
          newMax = mid + MIN_RANGE / 2;
          if (newMin < dataMin) { newMin = dataMin; newMax = dataMin + MIN_RANGE; }
          if (newMax > dataMax) { newMax = dataMax; newMin = dataMax - MIN_RANGE; }
        }
        u.setScale('x', { min: newMin, max: newMax });
      });

      // Wire reset button — use explicit data extents rather than null/null
      // because null/null may not reliably trigger the setScale hook in all uPlot builds.
      const _resetBtn = document.getElementById('reset-zoom-btn');
      const _resetHandler = () => {
        if (!AppState.chart) return;
        const d = AppState.chart.data[0];
        AppState.chart.setScale('x', { min: d[0], max: d[d.length - 1] });
      };
      // Remove any previously attached listener (prevents accumulation across file reloads)
      _resetBtn.removeEventListener('click', _resetBtn._resetHandler);
      _resetBtn._resetHandler = _resetHandler;
      _resetBtn.addEventListener('click', _resetHandler);

      // Wire double-click reset — same explicit data extents as the reset button
      AppState.chart.over.addEventListener('dblclick', () => {
        if (!AppState.chart) return;
        const d = AppState.chart.data[0];
        AppState.chart.setScale('x', { min: d[0], max: d[d.length - 1] });
      });

      // Initialize reset button visibility (hidden at full range on load)
      updateResetButtonVisibility(AppState.chart);

      // Create and wire minimap (NAVG-05)
      const { data: minimapData, series: minimapSeries } = buildChartData(AppState.dataModel, DEFAULT_SERIES);
      AppState.minimap = createMinimap(minimapData, minimapSeries);

      // Wire AppState.onZoomChange to minimap.updateSelection
      // This stub was set up in Phase 2 and called by the setScale hook added in 03-01.
      if (AppState.minimap) {
        AppState.onZoomChange = function(min, max) {
          AppState.minimap.updateSelection(min, max);
        };
        // Initialize minimap selection to full range (no zoom on first load)
        const dataMin = AppState.chart.data[0][0];
        const dataMax = AppState.chart.data[0][AppState.chart.data[0].length - 1];
        AppState.minimap.updateSelection(dataMin, dataMax);
      }

      // Phase 4: Build preset map and tab bar
      _viewPresets = buildViewPresets(AppState.dataModel);
      _activeView = 'All';
      buildViewTabs(_viewPresets);
      updateTabHighlight('All');

      // Phase 4.2: Wire legend click toggle
      wireLegendClicks(AppState.chart);

      // Initialize legend rows: non-DEFAULT series start out-of-view — hide from legend
      // with display:none directly (not via applyLegendRowStyle, which would only fade them).
      const initLegend = AppState.chart.root ? AppState.chart.root.querySelector('.u-legend') : null;
      if (initLegend) {
        const initTbody = initLegend.querySelector('tbody');
        if (initTbody) {
          Array.from(initTbody.childNodes)
            .filter(n => n.nodeType === 1)
            .forEach((row, rowIdx) => {
              const si = rowIdx + 1;
              if (si < AppState.chart.series.length) {
                if (AppState.chart.series[si].show === false) {
                  row.style.display = 'none';   // out-of-view at startup
                } else {
                  row.style.cursor = 'pointer'; // DEFAULT series: just add pointer
                }
              }
            });
        }
      }

      // Phase 4.4: Restore saved prefs (MUST be after minimap is fully wired above)
      applyRestoredPrefs(AppState.dataModel, _viewPresets);

      setStatus('Chart rendered \u2014 ' + dataModel.rowCount + ' rows, ' + defaultSet.size + ' of ' + (data.length - 1) + ' parameters visible');
    }

    // STEP 7 — Build the columnar data model
    function buildDataModel(fields, rows) {
      const datumField = fields.find(f => f === 'Datum');
      const zeitField = fields.find(f => f === 'Zeit');

      if (!datumField || !zeitField) {
        return { isOekoFEN: false, timestamps: [], columns: [] };
      }

      // Build timestamps array (Unix seconds, UTC)
      const timestamps = rows.map(row =>
        buildUnixTimestamp(row['Datum'], row['Zeit'])
      );

      // Build column descriptors for all non-timestamp, non-ignored columns
      const columns = [];
      let parseIssues = 0;

      for (const rawName of fields) {
        const classification = classifyColumn(rawName);
        if (!classification || classification === 'timestamp') continue;

        const { displayName, unit } = parseColumnHeader(rawName);
        const data = rows.map(row => {
          const val = parseGermanValue(row[rawName]);
          if (val === null && row[rawName] && row[rawName].trim() !== '') {
            parseIssues++;
          }
          return val;
        });

        columns.push({
          rawName,
          displayName,   // same as rawName — German names preserved, no translation (INTF-02)
          unit,
          group: classification.group,
          type: classification.type,
          data,
        });
      }

      return {
        isOekoFEN: true,
        timestamps,
        columns,
        parseIssues,
        rowCount: rows.length,
      };
    }

    // STEP 9 — Data summary panel (shown after load)
    function showDataSummary(dataModel, filename) {
      const summary = document.getElementById('data-summary');
      summary.classList.add('visible');

      // Group breakdown
      const groups = {};
      for (const col of dataModel.columns) {
        groups[col.group] = (groups[col.group] || 0) + 1;
      }
      const groupLines = Object.entries(groups)
        .map(([g, n]) => `${g}: ${n}`)
        .join(' · ');

      // Time range
      const ts = dataModel.timestamps;
      const fmt = t => {
        const d = new Date(t * 1000);
        return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
      };
      const timeRange = ts.length > 0 ? fmt(ts[0]) + '\u2013' + fmt(ts[ts.length - 1]) : 'N/A';

      summary.innerHTML = `
        <div class="summary-bar">
          <span><strong>${dataModel.rowCount}</strong> rows</span>
          <span><strong>${dataModel.columns.length}</strong> columns</span>
          <span><strong>${timeRange}</strong></span>
          <span>${groupLines}</span>
        </div>
      `;
    }

    // STEP 8 — Shared pipeline entry point (v1.1: extracted from onFileAccepted)
    // Called by onFileAccepted (file-drop path) and fetchCsv (Phase 6 fetch path).
    async function onCsvStringAccepted(csvString, displayName, fileDate) {
      const papaResult = parseCSVString(csvString);
      const { fields, rows } = normalizeHeaders(papaResult);
      const dataModel = buildDataModel(fields, rows);

      if (!dataModel.isOekoFEN) {
        showToast("This doesn't look like OekoFEN data \u2014 missing Datum/Zeit columns.", 'warning');
        setStatus('Parse failed: no Datum/Zeit columns.');
        return;
      }

      AppState.dataModel = dataModel;
      AppState.filename = displayName;
      AppState.fileDate = fileDate;

      // DACC-01: Persist to IndexedDB (upsert — same date updates existing record)
      if (fileDate) {
        upsertHistoryDay(fileDate, csvString).then(() => updateHistoryIndicator()).catch(e => {
          console.warn('[history] IndexedDB write failed:', e);
        });
      }

      // Show app view and data summary
      showAppView(displayName);
      showDataSummary(dataModel, displayName);

      // Render chart (Phase 2)
      createChart();

      const issueText = dataModel.parseIssues > 0
        ? ' \u2014 ' + dataModel.parseIssues + ' rows had parse issues'
        : '';
      setStatus('Loaded ' + dataModel.rowCount + ' rows, ' + dataModel.columns.length + ' columns' + issueText);
    }

    // Thin wrapper — file-drop path only
    async function onFileAccepted(file) {
      setStatus('Loading\u2026');
      try {
        const csvString = await readFileAsText(file);
        const dateMatch = file.name.match(/(\d{8})/);
        // DACC-01: Fallback — parse date from CSV content when filename has no date
        const fileDate = (dateMatch ? dateMatch[1] : null) || parseDateFromCsvString(csvString);
        await onCsvStringAccepted(csvString, file.name, fileDate);
      } catch (err) {
        console.error('[onFileAccepted] Error:', err);
        showToast('Failed to load file: ' + err.message, 'error');
        setStatus('Error: ' + err.message);
      }
    }

    // ─── Responsive resize (CHRT-03) ──────────────────────────────
    let _resizeTimer = null;

    function onWindowResize() {
      if (!AppState.chart) return;
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => {
        const chartContainer = document.getElementById('chart-area');
        AppState.chart.setSize({
          width:  chartContainer.clientWidth,
          height: chartContainer.clientHeight,
        });
        if (AppState.minimap) {
          const minimapContainer = document.getElementById('minimap-area');
          AppState.minimap.instance.setSize({
            width:  minimapContainer.clientWidth,
            height: minimapContainer.clientHeight,
          });
        }
      }, 100);
    }

    window.addEventListener('resize', onWindowResize);

    // ─── Performance diagnostic (CHRT-04) ─────────────────────────
    // Usage: benchmarkSeriesToggle() in browser console after loading a CSV
    // Expected: < 100ms per toggle
    function benchmarkSeriesToggle() {
      if (!AppState.chart) { console.warn('No chart — load a CSV first'); return; }
      const chart = AppState.chart;
      const N = 20;
      const t0 = performance.now();
      for (let i = 0; i < N; i++) {
        const isShown = chart.series[1] ? chart.series[1].show !== false : true;
        chart.setSeries(1, { show: !isShown });
      }
      const elapsed = performance.now() - t0;
      const perToggle = (elapsed / N).toFixed(2);
      console.log('Benchmark: ' + N + ' toggles in ' + elapsed.toFixed(1) + ' ms (' + perToggle + ' ms/toggle)');
      console.log(parseFloat(perToggle) < 100 ? 'CHRT-04: PASS (< 100ms)' : 'CHRT-04: FAIL (> 100ms)');
      chart.setSeries(1, { show: true }); // restore visibility
    }
    window.benchmarkSeriesToggle = benchmarkSeriesToggle;

    // ─── Phase 3/4 Integration Points ─────────────────────────────
    // Phase 3 (zoom/cursor/minimap) uses:
    //   AppState.chart.setScale('x', { min, max })  — zoom to time range
    //   AppState.chart.setCursor({ left, top })      — sync cursor with minimap
    //   AppState.chart.setSize({ width, height })    — already wired in onWindowResize
    //   AppState.onZoomChange(min, max)              — Phase 3 calls this after zoom
    //   AppState.zoomRange = { min, max }            — Phase 3 writes current zoom state
    //
    // Phase 4 (parameter management) uses:
    //   AppState.chart.setSeries(idx, { show })      — toggle series, no chart recreate
    //   AppState.chart.setData(newData)              — replace data for new view
    //   AppState.chartSeries                         — series opts array for reference
    //   Recreate uPlot (new uPlot) only when series COUNT changes (different preset view)

    // ─── Phase 4: Parameter Management ────────────────────────────

    // Group → group string mapping (matches classifyColumn() output in Phase 1)
    const VIEW_GROUPS = {
      'All':             null,                     // special: uses DEFAULT_SERIES
      'Boiler':          'Boiler',
      'Heating Circuit': 'Heating Circuit (HK1)',
      'Hot Water':       'Hot Water (WW1)',
      'Buffer':          'Buffer (PU1)',
      'Pellet Unit':     'Pellet Unit (PE1)',
    };

    // Module-level Phase 4 state
    let _viewPresets = null;   // Map<tabName, rawName[]> — built on file load
    let _activeView  = 'All'; // current tab name or 'Custom'

    // Build the six preset series lists from dataModel at runtime (not hardcoded rawNames).
    // "All" uses DEFAULT_SERIES filtered to columns that actually exist in the file.
    // System tabs use group membership from classifyColumn() + AT appended for context.
    function buildViewPresets(dataModel) {
      // Find AT rawName — the column whose name-part is exactly 'AT'
      const atColumn = dataModel.columns.find(c => {
        const namePart = c.rawName.match(/^(.+?)\s*(?:\[|$)/)?.[1]?.trim();
        return namePart === 'AT';
      });
      const atRawName = atColumn ? atColumn.rawName : null;

      const presets = new Map();

      // "All" tab: DEFAULT_SERIES filtered to columns present in this file
      presets.set('All', DEFAULT_SERIES.filter(rn =>
        dataModel.columns.some(c => c.rawName === rn)
      ));

      // System tabs: all columns in the group + AT (deduplicated)
      for (const [tabName, groupName] of Object.entries(VIEW_GROUPS)) {
        if (tabName === 'All') continue;
        const groupCols = dataModel.columns
          .filter(c => c.group === groupName)
          .map(c => c.rawName);

        // Empty guard: do not add tab for groups absent from the file
        if (groupCols.length === 0) continue;

        const seriesList = [...groupCols];
        if (atRawName && !seriesList.includes(atRawName)) {
          seriesList.push(atRawName);
        }
        presets.set(tabName, seriesList);
      }

      return presets;
    }

    // Compare a set of visible rawNames against all presets.
    // Returns the matching preset name, or 'Custom' if none match.
    function matchPreset(visibleRawNames, presets) {
      const visSet = new Set(visibleRawNames);
      for (const [name, list] of presets.entries()) {
        const listSet = new Set(list);
        if (visSet.size === listSet.size && [...visSet].every(r => listSet.has(r))) {
          return name;
        }
      }
      return 'Custom';
    }

    // Read the current show state of all data series from the live uPlot instance.
    // Returns array of rawName strings for series where show !== false.
    function getVisibleRawNames() {
      const u = AppState.chart;
      if (!u) return [];
      const visible = [];
      for (let i = 1; i < u.series.length; i++) {
        if (u.series[i].show !== false) {
          visible.push(u.series[i].label);
        }
      }
      return visible;
    }

    // Central state update: called after EVERY visibility change (tab switch, legend toggle, picker Apply).
    // 1. Reads current visibility from chart.
    // 2. Matches against presets.
    // 3. Updates tab highlight and Custom indicator.
    // 4. Persists to localStorage (Phase 4.4).
    function updateViewState() {
      const visibleRawNames = getVisibleRawNames();
      const matchedView = matchPreset(visibleRawNames, _viewPresets);
      _activeView = matchedView;
      updateTabHighlight(matchedView);
      savePrefs(_activeView, visibleRawNames);   // Phase 4.4: persist on every change
    }

    // Update the active tab highlight and Custom indicator DOM.
    function updateTabHighlight(viewName) {
      document.querySelectorAll('.view-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewName);
      });
      const indicator = document.getElementById('custom-indicator');
      if (indicator) indicator.style.display = (viewName === 'Custom') ? '' : 'none';
    }

    // Switch the chart to a named preset view. Calls setSeries() for each series —
    // NO chart recreate, zoom is fully preserved.
    // IMPORTANT: Batch-calls setSeries; call updateViewState() once after the loop.
    function setActiveView(viewName) {
      const u = AppState.chart;
      if (!u || !_viewPresets) return;
      const targetList = _viewPresets.get(viewName);
      if (!targetList) return;  // unknown view name — safety guard

      const targetSet = new Set(targetList);

      // Update each series based on whether its rawName is in the target list.
      // Suppress hook (third arg false) during the loop to avoid 9x updateViewState calls;
      // call updateViewState() once after.
      for (let i = 1; i < u.series.length; i++) {
        const rawName = u.series[i].label;
        const shouldShow = targetSet.has(rawName);
        if (u.series[i].show !== shouldShow) {
          u.setSeries(i, { show: shouldShow }, false);
        }
      }

      // Sync legend rows: in-view series shown (setActiveView forces show:true for all);
      // out-of-view series hidden from legend with display:none (not via applyLegendRowStyle,
      // so they can be faded/unchecked if re-added via picker later).
      const legend = u.root ? u.root.querySelector('.u-legend') : null;
      if (legend) {
        const tbody = legend.querySelector('tbody');
        if (tbody) {
          const rows = Array.from(tbody.childNodes).filter(n => n.nodeType === 1);
          rows.forEach((row, rowIdx) => {
            const seriesIdx = rowIdx + 1;
            if (seriesIdx < u.series.length) {
              if (targetSet.has(u.series[seriesIdx].label)) {
                applyLegendRowStyle(row, false);   // in-view: always shown after tab switch
              } else {
                row.style.display = 'none';        // out-of-view: off legend
                row.style.opacity = '';
              }
            }
          });
        }
      }

      updateViewState();
    }

    // Show or dim a legend row element.
    // Hidden rows stay visible in the legend as faded/unchecked so the user can click
    // them again to restore. Series outside the current view are hidden with display:none
    // directly by setActiveView() and applyRestoredPrefs() — not through this function.
    // Called by setActiveView(), legend click handler, applyRestoredPrefs(), and init.
    function applyLegendRowStyle(row, isHidden) {
      if (isHidden) {
        row.style.display = '';
        row.style.opacity = '0.35';
        row.style.cursor = 'pointer';
      } else {
        row.style.display = '';
        row.style.opacity = '';
        row.style.cursor = 'pointer';
      }
    }

    // Build the tab bar DOM inside #toolbar-row, to the LEFT of #reset-zoom-btn.
    // Also shows the #params-btn.
    // Called after createChart() when _viewPresets is populated.
    function buildViewTabs(presets) {
      // Clean up any previous instance (safety — destroyViewTabs should have run first)
      destroyViewTabs();

      const toolbar = document.getElementById('toolbar-row');
      const resetBtn = document.getElementById('reset-zoom-btn');

      const tabContainer = document.createElement('div');
      tabContainer.id = 'view-tabs';

      // Create one button per preset (Map preserves insertion order: All, Boiler, ...)
      for (const [tabName] of presets.entries()) {
        const btn = document.createElement('button');
        btn.className = 'view-tab';
        btn.dataset.view = tabName;
        btn.textContent = tabName;
        tabContainer.appendChild(btn);
      }

      // Custom indicator label (not a tab, just a status text)
      const customIndicator = document.createElement('span');
      customIndicator.id = 'custom-indicator';
      customIndicator.textContent = 'Custom';
      tabContainer.appendChild(customIndicator);

      // Insert tab container BEFORE the Reset Zoom button (left side of toolbar)
      toolbar.insertBefore(tabContainer, resetBtn);

      // Event delegation — one listener on the container for all tab clicks
      tabContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.view-tab');
        if (!btn) return;
        const viewName = btn.dataset.view;
        if (viewName === _activeView) return;  // no-op if already active
        setActiveView(viewName);
      });

      // Show the Parameters button and wire click handler (04-03)
      const paramsBtn = document.getElementById('params-btn');
      if (paramsBtn) {
        paramsBtn.style.display = '';
        // Remove any previous handler to prevent accumulation across file reloads
        if (paramsBtn._paramsHandler) {
          paramsBtn.removeEventListener('click', paramsBtn._paramsHandler);
        }
        paramsBtn._paramsHandler = openPickerModal;
        paramsBtn.addEventListener('click', openPickerModal);
      }
    }

    // Remove the #view-tabs DOM element and hide the Parameters button.
    // Called inside destroyChart() before the uPlot instance is destroyed.
    function destroyViewTabs() {
      const el = document.getElementById('view-tabs');
      if (el) el.remove();
      const paramsBtn = document.getElementById('params-btn');
      if (paramsBtn) paramsBtn.style.display = 'none';
    }

    // ─── Phase 4.2: Legend click toggle ───────────────────────────

    // Wire event delegation on the .u-legend table for series show/hide.
    // CRITICAL: .u-legend must have pointer-events: auto (fixed in 04-01 Task 1).
    // CRITICAL INDEX OFFSET: with legend.live:false, series[0] (x-axis) has NO legend row.
    //   tbody row 0 → u.series[1], row 1 → u.series[2], etc. Always add 1 to rowIndex.
    function wireLegendClicks(u) {
      const legend = u.root ? u.root.querySelector('.u-legend') : null;
      if (!legend) return;

      // Apply cursor:pointer to all existing series rows
      const tbody = legend.querySelector('tbody');
      if (tbody) {
        Array.from(tbody.childNodes)
          .filter(n => n.nodeType === 1)
          .forEach(row => { row.style.cursor = 'pointer'; });
      }

      function onLegendClick(e) {
        // Capture phase — stop event before it reaches uPlot's built-in <th> toggle handler.
        // Without this, uPlot and our handler both fire → double-toggle → no visible change.
        e.stopPropagation();

        const u = AppState.chart;
        if (!u) return;

        // Walk up from clicked element to the .u-series <tr> row
        const row = e.target.closest('.u-series');
        if (!row) return;

        const tbody = legend.querySelector('tbody');
        if (!tbody) return;
        const rows = Array.from(tbody.childNodes).filter(n => n.nodeType === 1);
        const rowIndex = rows.indexOf(row);
        if (rowIndex < 0) return;

        // +1 offset: series[0] is x-axis with no legend row when legend.live:false
        const seriesIdx = rowIndex + 1;
        if (seriesIdx >= u.series.length) return;  // safety guard

        const currentShow = u.series[seriesIdx].show !== false;
        const newShow = !currentShow;

        u.setSeries(seriesIdx, { show: newShow });

        // Apply inline style for visual feedback (overrides uPlot's .u-off opacity:0.3)
        applyLegendRowStyle(row, !newShow);

        // Update tab indicator and persist (Phase 4 shared state machine from 04-01)
        updateViewState();
      }

      // Capture phase (true) ensures our handler fires before uPlot's bubble-phase
      // handler on the <th> element, allowing stopPropagation() to prevent double-toggle.
      legend.addEventListener('click', onLegendClick, true);
      // Store handler reference on the legend element for cleanup in unwireLegendClicks()
      legend._phase4ClickHandler = onLegendClick;
    }

    // Remove the legend click handler added by wireLegendClicks().
    // Called inside destroyChart() to prevent listener accumulation across file reloads.
    function unwireLegendClicks() {
      const u = AppState.chart;
      if (!u) return;
      const legend = u.root ? u.root.querySelector('.u-legend') : null;
      if (legend && legend._phase4ClickHandler) {
        legend.removeEventListener('click', legend._phase4ClickHandler, true);
        legend._phase4ClickHandler = null;
      }
    }

    // ─── Phase 4.3: Custom parameter picker modal ─────────────────

    // Close and remove the picker modal from DOM.
    // Safe to call even if modal is not open.
    function closePickerModal() {
      const modal = document.getElementById('picker-modal');
      if (modal) modal.remove();
    }

    // ─── Phase 4.4: localStorage persistence ─────────────────

    const PREFS_KEY = 'oekofen-viewer-prefs';

    // Persist current view and visible series to localStorage.
    // Shape: { activeView: string, visibleSeries: string[] }
    // Called from updateViewState() after every visibility change.
    // Wrapped in try/catch for QuotaExceededError and SecurityError (Safari private mode).
    function savePrefs(activeView, visibleSeries) {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          activeView,
          visibleSeries,
        }));
      } catch (e) {
        // Silent degradation — persistence is a convenience, not required for chart to work
        console.warn('[savePrefs] localStorage write failed:', e.name);
      }
    }

    // Load persisted prefs from localStorage.
    // Returns null if missing, invalid JSON, or wrong shape.
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        // Validate shape: must have visibleSeries as an array
        if (typeof parsed !== 'object' || !Array.isArray(parsed.visibleSeries)) return null;
        return parsed;
      } catch (e) {
        console.warn('[loadPrefs] localStorage read failed:', e.name);
        return null;
      }
    }

    // Restore saved prefs to the live chart after createChart() + minimap wiring.
    // Validates each saved rawName against dataModel.columns — only restores series
    // that actually exist in the current file.
    // Falls back to DEFAULT_SERIES (current chart state) with a warning toast
    // if zero saved series survive validation.
    function applyRestoredPrefs(dataModel, presets) {
      const prefs = loadPrefs();
      if (!prefs) return;  // no saved prefs — stay with default All view

      // Validate: only keep rawNames that exist in the current data model
      const validSeries = prefs.visibleSeries.filter(rn =>
        dataModel.columns.some(c => c.rawName === rn)
      );

      if (validSeries.length === 0) {
        // Saved series are all absent from the new file — fall back to defaults
        showToast('Saved settings could not be applied — using defaults', 'warning');
        return;
      }

      const u = AppState.chart;
      if (!u) return;

      const validSet = new Set(validSeries);

      // Apply visibility to each series; suppress hook (false) during loop
      for (let i = 1; i < u.series.length; i++) {
        const rawName = u.series[i].label;
        const shouldShow = validSet.has(rawName);
        if (u.series[i].show !== shouldShow) {
          u.setSeries(i, { show: shouldShow }, false);
        }
      }

      // Compute matched view first — needed to determine which rows are in-view vs out-of-view
      const matchedView = matchPreset(validSeries, presets);
      _activeView = matchedView;
      updateTabHighlight(matchedView);

      // For named presets the viewSet is the preset list; for 'Custom' use the visible set
      // (series that aren't visible in a Custom state aren't part of the selection).
      const viewPreset = presets.get(matchedView);
      const viewSet = viewPreset ? new Set(viewPreset) : validSet;

      // Sync legend rows: in-view series shown/faded; out-of-view series off legend
      const legend = u.root ? u.root.querySelector('.u-legend') : null;
      if (legend) {
        const tbody = legend.querySelector('tbody');
        if (tbody) {
          const rows = Array.from(tbody.childNodes).filter(n => n.nodeType === 1);
          rows.forEach((row, rowIdx) => {
            const seriesIdx = rowIdx + 1;
            if (seriesIdx < u.series.length) {
              const rawName = u.series[seriesIdx].label;
              const isHidden = u.series[seriesIdx].show === false;
              if (viewSet.has(rawName)) {
                applyLegendRowStyle(row, isHidden);  // in-view: shown or faded
              } else {
                row.style.display = 'none';           // out-of-view: off legend
                row.style.opacity = '';
              }
            }
          });
        }
      }

      // NOTE: Do NOT call savePrefs() here — we're restoring, not changing prefs
    }

    // Open the parameter picker modal.
    // Reads current u.series[i].show state at open time — chart is the source of truth.
    // No minimum selection enforced (user can uncheck everything and click Apply).
    function openPickerModal() {
      // Prevent double-open
      if (document.getElementById('picker-modal')) return;

      const u = AppState.chart;
      const dataModel = AppState.dataModel;
      if (!u || !dataModel) return;

      // Build a set of currently visible rawNames (source of truth: live chart state)
      const currentlyVisible = new Set(getVisibleRawNames());

      // Group order matches VIEW_GROUPS: Boiler, Heating Circuit, Hot Water, Buffer, Pellet Unit
      // Use values from VIEW_GROUPS (excluding 'All' which maps to null) to determine display order
      const groupOrder = Object.values(VIEW_GROUPS).filter(g => g !== null);

      // Build a map of group → column list from dataModel
      const groupMap = new Map();
      for (const groupName of groupOrder) {
        const cols = dataModel.columns.filter(c => c.group === groupName);
        if (cols.length > 0) groupMap.set(groupName, cols);
      }

      // ── Backdrop (full-screen overlay) ──────────────────────────
      const backdrop = document.createElement('div');
      backdrop.id = 'picker-modal';
      backdrop.style.cssText = [
        'position:fixed; inset:0; z-index:200;',
        'background:rgba(22,25,43,0.35);',
        'display:flex; align-items:center; justify-content:center;',
        'animation: backdrop-in 150ms ease-out both;',
      ].join('');

      // Close on backdrop click (but not on dialog click)
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closePickerModal();
      });

      // ── Dialog ───────────────────────────────────────────────────
      const dialog = document.createElement('div');
      dialog.className = 'picker-dialog';

      // Header
      const header = document.createElement('div');
      header.className = 'picker-header';
      header.textContent = 'Add Parameters';
      dialog.appendChild(header);

      // Body — scrollable group sections
      const body = document.createElement('div');
      body.className = 'picker-body';

      for (const [groupName, cols] of groupMap.entries()) {
        // Group section container (collapsible)
        const section = document.createElement('div');
        section.className = 'picker-group-section';

        // Group header (clickable to collapse/expand)
        const groupHeader = document.createElement('div');
        groupHeader.className = 'picker-group-header';

        const chevron = document.createElement('span');
        chevron.className = 'picker-group-chevron';
        chevron.textContent = '\u25be';

        const groupLabel = document.createElement('span');
        groupLabel.textContent = groupName;

        groupHeader.appendChild(chevron);
        groupHeader.appendChild(groupLabel);

        // Rows container (shown/hidden on collapse)
        const rowsContainer = document.createElement('div');
        rowsContainer.className = 'picker-group-rows';

        // Toggle collapse on header click
        groupHeader.addEventListener('click', () => {
          section.classList.toggle('picker-group-collapsed');
        });

        // Build one row per column
        for (const col of cols) {
          const row = document.createElement('div');
          row.className = 'picker-row';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.id = 'picker-cb-' + col.rawName.replace(/[^a-zA-Z0-9]/g, '_');
          cb.dataset.rawName = col.rawName;
          cb.checked = currentlyVisible.has(col.rawName);

          const label = document.createElement('label');
          label.htmlFor = cb.id;
          label.textContent = col.rawName;

          row.appendChild(cb);
          row.appendChild(label);

          // Binary badge for discrete columns
          if (col.type === 'discrete') {
            const badge = document.createElement('span');
            badge.className = 'picker-badge-binary';
            badge.textContent = 'binary';
            row.appendChild(badge);
          }

          // Clicking the row (not just the checkbox) toggles the checkbox
          row.addEventListener('click', (e) => {
            if (e.target !== cb) cb.checked = !cb.checked;
          });

          rowsContainer.appendChild(row);
        }

        section.appendChild(groupHeader);
        section.appendChild(rowsContainer);
        body.appendChild(section);
      }
      dialog.appendChild(body);

      // Footer — Cancel and Apply buttons
      const footer = document.createElement('div');
      footer.className = 'picker-footer';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'picker-btn-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', closePickerModal);

      const applyBtn = document.createElement('button');
      applyBtn.className = 'picker-btn-apply';
      applyBtn.textContent = 'Apply';
      applyBtn.addEventListener('click', () => {
        // Read all checkboxes from the modal
        const checkboxes = backdrop.querySelectorAll('input[type="checkbox"]');
        const u = AppState.chart;
        if (!u) { closePickerModal(); return; }

        // Apply each changed series using setSeries()
        checkboxes.forEach(cb => {
          const rawName = cb.dataset.rawName;
          // Find series index: AppState.chartSeries[i].label === rawName for i >= 1
          const seriesIdx = AppState.chartSeries
            ? AppState.chartSeries.findIndex((s, i) => i > 0 && s.label === rawName)
            : -1;
          if (seriesIdx < 1) return;  // not in chart — skip

          const currentShow = u.series[seriesIdx].show !== false;
          const wantShow = cb.checked;
          if (currentShow !== wantShow) {
            u.setSeries(seriesIdx, { show: wantShow });

            // Sync legend row inline style
            const legend = u.root ? u.root.querySelector('.u-legend') : null;
            if (legend) {
              const tbody = legend.querySelector('tbody');
              if (tbody) {
                const rows = Array.from(tbody.childNodes).filter(n => n.nodeType === 1);
                const row = rows[seriesIdx - 1];  // -1 because legend rows start at series[1]
                if (row) applyLegendRowStyle(row, !wantShow);
              }
            }
          }
        });

        // Update tab indicator and persist
        updateViewState();
        closePickerModal();
      });

      footer.appendChild(cancelBtn);
      footer.appendChild(applyBtn);
      dialog.appendChild(footer);

      backdrop.appendChild(dialog);
      document.body.appendChild(backdrop);

      // Escape key closes the modal
      function onEscape(e) {
        if (e.key === 'Escape') {
          closePickerModal();
          document.removeEventListener('keydown', onEscape);
        }
      }
      document.addEventListener('keydown', onEscape);
    }

    // ─── Settings Modal (v1.1) ────────────────────────────────────

    function closeSettingsModal() {
      const el = document.getElementById('settings-modal');
      if (el) el.remove();
      document.removeEventListener('keydown', _settingsEscHandler);
    }

    let _settingsEscHandler = null;

    function openSettingsModal() {
      if (document.getElementById('settings-modal')) return; // prevent double-open

      // ── Backdrop ────────────────────────────────────────────────
      const backdrop = document.createElement('div');
      backdrop.id = 'settings-modal';
      backdrop.style.cssText = [
        'position:fixed; inset:0; z-index:200;',
        'background:rgba(22,25,43,0.35);',
        'display:flex; align-items:center; justify-content:center;',
      ].join('');
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeSettingsModal();
      });

      // ── Dialog ──────────────────────────────────────────────────
      const dialog = document.createElement('div');
      dialog.style.cssText = [
        'background:var(--bg-l1); border-radius:var(--r-lg);',
        'box-shadow:0 8px 32px rgba(22,25,43,0.18);',
        'width:360px; max-width:calc(100vw - 32px);',
        'font-family:var(--font);',
      ].join('');

      // Header

    // ─── Fetch CSV from heater (v1.1 Phase 6) ─────────────────

    function showFetchControls() {
      const el = document.getElementById('fetch-controls');

    }

    function hideFetchControls() {
      const el = document.getElementById('fetch-controls');

    }

    function setFetchButtonState(state) {
      const btn = document.getElementById('fetch-btn');
      if (!btn) return;
      if (state === 'loading') {
        btn.disabled = true;
        btn.textContent = 'Downloading\u2026';
      } else {
        btn.disabled = false;
        btn.textContent = 'Download from Heater';
      }
    }

    function handleFetchHttpError(status) {
      if (status === 401) {
        showToast('Heater rejected the request (HTTP 401) \u2014 check your API password in Settings.', 'error', 8000);
        setStatus('Error: wrong password or unauthorized (HTTP 401).');
      } else if (status === 404) {
        showToast('Heater returned 404 \u2014 API password may be incorrect. Check Settings.', 'error', 8000);
        setStatus('Error: wrong password or bad URL (HTTP 404).');
      } else {
        showToast('Heater returned HTTP ' + status + '.', 'error', 6000);
        setStatus('Fetch error: HTTP ' + status + '.');
      }
    }

    function handleFetchNetworkError(err) {
      if (err.name === 'TimeoutError' || err.name === 'AbortError') {
        // AbortSignal.timeout fires TimeoutError in Chrome 124+, AbortError in Chrome 103-123
        showToast(
          'Heater did not respond in 10 seconds. Check the IP address and port in Settings.',
          'error', 8000
        );
        setStatus('Fetch timeout \u2014 heater unreachable.');
      } else {
        // TypeError: Failed to fetch — proxy could not reach the heater (wrong IP, port, or heater offline).
        showToast(
          'Could not reach the heater. Check the IP address and port in Settings.',
          'error', 8000
        );
        setStatus('Fetch failed \u2014 heater unreachable.');
      }
    }

    async function fetchCsv(command) {
      // ERR-01: file:// origin — app must be served via server.py, not opened as a local file
      if (window.location.protocol === 'file:') {
        showToast(
          'Network fetch requires a web server. ' +
          'Double-click start.bat or run: python server.py ' +
          'then open http://localhost:8080 in your browser.',
          'error', 10000
        );
        setStatus('Error: cannot fetch from file:// origin.');
        return;
      }

      // CONN-03: Rate-limit guard — 2500ms minimum between fetches
      const now = Date.now();
      if (_lastFetchAt > 0 && (now - _lastFetchAt) < 2500) {
        showToast('Please wait before downloading again.', 'warning', 3000);
        return;
      }
      // Write timestamp when fetch actually starts (not when response arrives)
      _lastFetchAt = Date.now();

      setFetchButtonState('loading');

      // Route through local proxy — server.py fetches the heater server-side, bypassing CORS.
      // Direct browser fetch to the OekoFEN heater is permanently blocked (no Access-Control-Allow-Origin header).
      const heaterUrl = 'http://' + _settings.ip + ':' + _settings.port + '/' + _settings.password + '/' + command;
      const url = '/proxy?url=' + encodeURIComponent(heaterUrl);

      try {
        // ERR-02: 10-second timeout via AbortSignal.timeout (Chrome 103+, FF 100+, Safari 16+)
        const response = await fetch(url, { signal: AbortSignal.timeout(10000) });

        if (!response.ok) {
          // ERR-03: HTTP 404 = wrong password; ERR-04: HTTP 401 = rate limit exceeded on heater
          handleFetchHttpError(response.status);
          return;
        }

        // OekoFEN HTTP API sends windows-1252 — same encoding as files saved to disk.
        // NEVER use response.text(): browser defaults to UTF-8, produces mojibake on °, ä, ö, ü.
        const buffer = await response.arrayBuffer();
        const csvString = new TextDecoder('windows-1252').decode(buffer);

        // Derive fileDate from command name (best-effort; used for chart title)
        const today = new Date();
        const pad = n => String(n).padStart(2, '0');
        let fileDate = null;
        if (command === 'log_today') {
          fileDate = '' + today.getFullYear() + pad(today.getMonth() + 1) + pad(today.getDate());
        }
        // DACC-01: Fallback — parse date from CSV content when command-derived date is unavailable
        fileDate = fileDate || parseDateFromCsvString(csvString);
        const displayName = command + '.csv';

        // CONN-04: Feed decoded CSV into the shared pipeline (same as file-drop path)
        await onCsvStringAccepted(csvString, displayName, fileDate);

      } catch (err) {
        handleFetchNetworkError(err);
      } finally {
        // Re-enable button after full 2500ms window from fetch start
        const elapsed = Date.now() - _lastFetchAt;
        const remaining = Math.max(0, 2500 - elapsed);
        clearTimeout(_rateLimitTimer);
        _rateLimitTimer = setTimeout(() => setFetchButtonState('ready'), remaining);
      }
    }
