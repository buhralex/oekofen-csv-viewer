<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OekoFEN CSV Viewer</title>
  <link rel="stylesheet" href="uPlot.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary:    #1a1a2e;
      --bg-secondary:  #16213e;
      --bg-surface:    #0f3460;
      --text-primary:  #e0e0e0;
      --text-muted:    #a0a0b8;
      --accent:        #4fc3f7;
      --accent-dim:    rgba(79, 195, 247, 0.15);
      --accent-border: rgba(79, 195, 247, 0.6);
      --danger:        #ef5350;
      --success:       #66bb6a;
      --warning:       #ffa726;
      --border:        rgba(255, 255, 255, 0.08);
      --radius:        8px;
      --font:          system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ─── Drop Zone ──────────────────────────────────────────── */

    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      transition: background 0.2s ease, border-color 0.15s, background-color 0.15s;
      z-index: 10;
    }

    #drop-zone.drag-over {
      background: var(--bg-secondary);
    }

    #drop-zone.drag-over #drop-message {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    #drop-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 60px 80px;
      border: 2px dashed var(--accent-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
      text-align: center;
      transition: border-color 0.2s ease, background 0.2s ease;
      animation: pulse-border 3s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: var(--accent-border); }
      50%       { border-color: var(--accent); }
    }

    #drop-zone.drag-over #drop-message {
      animation: none;
    }

    #drop-icon {
      font-size: 56px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.8;
      user-select: none;
    }

    #drop-message p {
      font-size: 18px;
      color: var(--text-primary);
      font-weight: 500;
    }

    #drop-message p.sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    #pick-file-btn {
      margin-top: 4px;
      padding: 10px 28px;
      background: var(--accent);
      color: #0d0d1a;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    #pick-file-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    #pick-file-btn:active {
      transform: translateY(0);
    }

    /* ─── App Header ─────────────────────────────────────────── */

    #app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      z-index: 20;
      gap: 12px;
    }

    #app-header.visible {
      display: flex;
    }

    #header-filename {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    #header-filename strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    #load-another-btn {
      padding: 5px 14px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    #load-another-btn:hover {
      background: var(--accent-dim);
    }

    /* ─── Data Summary ───────────────────────────────────────── */

    #data-summary {
      position: fixed;
      top: 50px; left: 0; right: 0;
      display: none;
      padding: 16px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      z-index: 15;
    }

    #data-summary.visible {
      display: block;
    }

    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-item .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .summary-item .value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .summary-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .group-badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent);
    }

    /* ─── Chart Area ─────────────────────────────────────────── */

    #chart-area {
      position: fixed;
      left: 0; right: 0; bottom: 28px;
      display: none;
      overflow: hidden;
    }

    #chart-area.visible {
      display: block;
    }

    /* ─── Status Bar ─────────────────────────────────────────── */

    #status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      z-index: 20;
    }

    #status-text {
      flex: 1;
    }

    /* ─── Toast Notifications ────────────────────────────────── */

    #toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      min-width: 260px;
      max-width: 400px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      animation: toast-in 0.25s ease forwards;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast.out {
      animation: toast-out 0.25s ease forwards;
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-8px) scale(0.96); }
    }

    .toast-error   { background: #2d1414; border: 1px solid var(--danger); color: #ef9a9a; }
    .toast-warning { background: #2d2214; border: 1px solid var(--warning); color: #ffcc80; }
    .toast-info    { background: #142233; border: 1px solid var(--accent-border); color: var(--accent); }
    .toast-success { background: #142014; border: 1px solid var(--success); color: #a5d6a7; }
  </style>
</head>
<body>

  <!-- Drop zone: full-page when no file loaded -->
  <div id="drop-zone">
    <div id="drop-message">
      <div id="drop-icon">&#x1F4C4;</div>
      <p>Drop an OekoFEN CSV file here</p>
      <p class="sub">touch_YYYYMMDD.csv</p>
      <p>or</p>
      <button id="pick-file-btn">Select File</button>
      <input type="file" id="file-input" accept=".csv" style="display:none">
    </div>
  </div>

  <!-- Header bar: compact, shown after file loads -->
  <header id="app-header">
    <span id="header-filename"></span>
    <button id="load-another-btn">Load Another</button>
  </header>

  <!-- Data summary: shown after load -->
  <div id="data-summary"></div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- Chart area: Phase 2+ -->
  <div id="chart-area"></div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="status-text">Ready</span>
  </div>

  <script src="uPlot.iife.min.js"></script>
  <script src="papaparse.min.js"></script>
  <script>
    'use strict';

    // ─── App State ────────────────────────────────────────────────
    const AppState = {
      dataModel: null,   // { timestamps: Float64Array, columns: Column[] }
      filename: null,
      fileDate: null,
      // Phase 2+ view state: visibleColumns, zoomRange
    };
    window.AppState = AppState; // expose for debugging

    // ─── Column descriptor shape (for Phase 2+) ───────────────────
    // {
    //   rawName: string,        // e.g. "HK1 VL Ist[°C]"
    //   displayName: string,    // trimmed, same as rawName (no translation)
    //   unit: string|null,      // e.g. "°C"
    //   group: string,          // e.g. "Heating Circuit (HK1)"
    //   type: 'continuous'|'discrete',
    //   data: number[],         // parallel to timestamps array
    // }

    // ─── Toast notifications ──────────────────────────────────────
    function showToast(message, type = 'info', duration = 4000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.textContent = message;
      container.appendChild(toast);

      const dismiss = () => {
        toast.classList.add('out');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      };

      if (duration > 0) {
        setTimeout(dismiss, duration);
      }
    }

    // ─── Status bar ───────────────────────────────────────────────
    function setStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    // ─── UI state transitions ─────────────────────────────────────
    function showDropZone() {
      document.getElementById('drop-zone').style.display = 'flex';
      document.getElementById('app-header').classList.remove('visible');
      document.getElementById('data-summary').classList.remove('visible');
      document.getElementById('chart-area').classList.remove('visible');
    }

    function showAppView(filename) {
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('app-header').classList.add('visible');
      document.getElementById('data-summary').classList.add('visible');
      document.getElementById('chart-area').classList.add('visible');
      document.getElementById('header-filename').innerHTML =
        'File: <strong>' + filename + '</strong>';
    }

    // ─── Navigation guard ─────────────────────────────────────────
    // Prevents browser from navigating away when user drops a file
    // anywhere on the page (outside the drop zone).
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      // File dropped outside the designated drop zone — ignore silently.
      // The drop zone has its own handler that calls handleFileDrop().
    });

    // ─── Drop zone drag handlers ──────────────────────────────────
    // Drag depth counter prevents visual flicker when cursor moves
    // between child elements inside the drop zone.
    let dragDepth = 0;
    const dropZone = document.getElementById('drop-zone');

    dropZone.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dragDepth--;
      if (dragDepth === 0) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFileDrop(file);
    });

    // ─── Pick-file button ─────────────────────────────────────────
    document.getElementById('pick-file-btn').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', e => {
      // File processing implemented in Plan 02
      if (e.target.files.length > 0) {
        setStatus('File selected — processing in Plan 02');
      }
    });

    // ─── Load Another button ──────────────────────────────────────
    document.getElementById('load-another-btn').addEventListener('click', () => {
      showDropZone();
      AppState.dataModel = null;
      AppState.filename = null;
      AppState.fileDate = null;
    });

    // ─── Init ─────────────────────────────────────────────────────
    setStatus('Ready — drop an OekoFEN CSV file to begin');
  </script>
</body>
</html>
