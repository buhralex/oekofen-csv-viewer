<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OekoFEN CSV Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="uPlot.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Surfaces — Light professional */
      --bg-base:   #F0F2F8;
      --bg-l1:     #FFFFFF;
      --bg-l2:     #ECEEF5;
      --bg-l3:     #DEE1EE;
      /* Text */
      --text-1:    #16192B;
      --text-2:    #4A5070;
      --text-3:    #9399B5;
      /* Accent — warm orange/heat gradient */
      --orange:    #F97316;
      --orange-dim: rgba(249, 115, 22, 0.10);
      --orange-glow: rgba(249, 115, 22, 0.20);
      /* Blue for interactive elements */
      --blue:      #2563EB;
      --blue-dim:  rgba(37, 99, 235, 0.09);
      --blue-glow: rgba(37, 99, 235, 0.20);
      /* Primary gradient — fire/heat */
      --grad:      linear-gradient(135deg, #FF8534 0%, #EF4444 100%);
      /* Separators */
      --sep:       rgba(22, 25, 43, 0.07);
      --sep-strong: rgba(22, 25, 43, 0.12);
      /* Glass — frosted white */
      --glass-bg:  rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.95);
      /* Radius scale */
      --r-sm:  6px;
      --r-md:  10px;
      --r-lg:  14px;
      --r-xl:  18px;
      --r-pill: 100px;
      /* Fonts */
      --font:      'Outfit', system-ui, -apple-system, sans-serif;
      --font-mono: 'Fira Code', 'SF Mono', 'Courier New', monospace;
      /* Layout — original pixel values kept */
      --toolbar-height: 32px;
      --minimap-height: 72px;
      /* Backward compat */
      --accent:       #F97316;
      --accent-dim:   rgba(249, 115, 22, 0.10);
      --accent-border: rgba(249, 115, 22, 0.40);
      --bg-primary:   #F0F2F8;
      --bg-secondary: #FFFFFF;
      --text-primary: #16192B;
      --text-muted:   rgba(22, 25, 43, 0.42);
      --border:       rgba(22, 25, 43, 0.08);
      --radius:       10px;
    }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-1);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Drop Zone ──────────────────────────────────────────── */

    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      z-index: 10;
      transition: background 0.3s;
    }

    /* Warm ambient background */
    #drop-zone::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 60%, rgba(249, 115, 22, 0.10) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 25% 20%, rgba(37, 99, 235, 0.06) 0%, transparent 65%),
        radial-gradient(ellipse 40% 35% at 80% 80%, rgba(239, 68, 68, 0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Ambient glow behind the card — deepens on drag-over */
    #drop-zone::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -58%);
      width: 520px; height: 360px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(249,115,22,0.12) 0%, transparent 70%);
      pointer-events: none;
      transition: opacity 0.4s;
      opacity: 1;
    }

    #drop-zone.drag-over::after {
      opacity: 2.5;
    }

    /* Small app label above card */
    .drop-eyebrow {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-3);
      white-space: nowrap;
      user-select: none;
    }

    #drop-message {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 52px 80px 48px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.90);
      border-radius: var(--r-xl);
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(22, 25, 43, 0.05) inset,
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 24px 64px rgba(22, 25, 43, 0.12),
        0 4px 16px rgba(22, 25, 43, 0.07),
        0 1px 4px rgba(22, 25, 43, 0.04);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      animation: card-enter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #drop-zone.drag-over #drop-message {
      border-color: rgba(249, 115, 22, 0.55);
      box-shadow:
        0 0 0 3px rgba(249, 115, 22, 0.15),
        0 0 0 1px rgba(22, 25, 43, 0.05) inset,
        0 24px 64px rgba(22, 25, 43, 0.12);
      background: rgba(255, 255, 255, 0.95);
    }

    #drop-icon {
      color: var(--orange);
      margin-bottom: 2px;
      user-select: none;
    }

    #drop-zone.drag-over #drop-icon {
      color: #EF4444;
    }

    .drop-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-1);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    #drop-message p.sub {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-3);
      letter-spacing: 0.02em;
    }

    #pick-file-btn {
      margin-top: 6px;
      padding: 9px 28px;
      background: var(--grad);
      color: #ffffff;
      border: none;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.32), 0 2px 6px rgba(249, 115, 22, 0.22);
      transition: opacity 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    #pick-file-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.38), 0 2px 8px rgba(249, 115, 22, 0.28);
    }

    #pick-file-btn:active {
      transform: scale(0.97);
      opacity: 0.85;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.20);
    }

    /* ─── App Header ─────────────────────────────────────────── */

    #app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      display: none;
      align-items: center;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--sep);
      box-shadow: 0 1px 12px rgba(22, 25, 43, 0.07);
      z-index: 20;
      gap: 10px;
    }

    #app-header.visible {
      display: flex;
    }

    /* App name — gradient accent */
    #app-header::before {
      content: 'OekoFEN';
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex-shrink: 0;
      padding-right: 14px;
      border-right: 1px solid var(--sep-strong);
      margin-right: 2px;
      line-height: 1;
    }

    #header-filename {
      font-size: 13px;
      font-family: var(--font-mono);
      font-weight: 400;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    #header-filename strong {
      color: var(--text-2);
      font-weight: 400;
    }

    #load-another-btn {
      padding: 5px 14px;
      background: var(--bg-l2);
      color: var(--text-2);
      border: 1px solid var(--sep-strong);
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    #load-another-btn:hover {
      background: var(--bg-l3);
      color: var(--text-1);
    }

    /* ─── Data Summary ───────────────────────────────────────── */

    #data-summary {
      position: fixed;
      top: 50px; left: 0; right: 0;
      height: 40px;
      display: none;
      align-items: center;
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--sep);
      padding: 0 16px;
      z-index: 15;
    }

    #data-summary.visible {
      display: flex;
    }

    .summary-bar {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      width: 100%;
    }

    .summary-bar > span {
      padding: 0 14px;
      border-right: 0.5px solid var(--sep-strong);
      line-height: 1;
      flex-shrink: 0;
    }

    .summary-bar > span:first-child { padding-left: 0; }

    .summary-bar > span:last-child {
      border-right: none;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-bar strong {
      color: var(--text-2);
      font-weight: 600;
    }

    /* ─── Toolbar Row ────────────────────────────────────────── */

    #toolbar-row {
      position: fixed;
      top: 90px; left: 0; right: 0;
      height: var(--toolbar-height);
      display: none;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--sep);
      z-index: 15;
    }

    #toolbar-row.visible {
      display: flex;
    }

    #reset-zoom-btn {
      padding: 2px 12px;
      background: var(--orange-dim);
      color: var(--orange);
      border: none;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    #reset-zoom-btn:hover {
      background: var(--orange-glow);
    }

    /* ─── Chart Area ─────────────────────────────────────────── */

    #chart-area {
      position: fixed;
      top: 122px;
      left: 0; right: 0; bottom: 100px;
      display: none;
      overflow: hidden;
      background: var(--bg-base);
    }

    #chart-area.visible {
      display: block;
    }

    /* ─── Minimap Area ───────────────────────────────────────── */

    #minimap-area {
      position: fixed;
      bottom: 28px; left: 0; right: 0;
      height: var(--minimap-height);
      display: none;
      background: var(--bg-l1);
      border-top: 0.5px solid var(--sep);
    }

    #minimap-area.visible {
      display: block;
    }

    /* ─── uPlot Overrides ────────────────────────────────────── */

    .u-wrap {
      background: var(--bg-base) !important;
    }

    /* Orange zoom-region highlight on minimap */
    #minimap-area .u-select {
      background: rgba(249, 115, 22, 0.14) !important;
      border: 1px solid rgba(249, 115, 22, 0.50) !important;
    }

    /* Hide minimap cursor crosshair lines */
    #minimap-area .u-cursor-x,
    #minimap-area .u-cursor-y,
    #minimap-area .u-cursor-pt {
      display: none !important;
    }

    /* Floating legend — frosted white card */
    .u-legend {
      position: absolute !important;
      top: 28px !important;
      left: 10px !important;
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(22, 25, 43, 0.10) !important;
      border-radius: var(--r-md) !important;
      padding: 8px 12px !important;
      font-size: 11px !important;
      font-family: var(--font) !important;
      color: var(--text-2) !important;
      pointer-events: auto !important;
      z-index: 10 !important;
      box-shadow: 0 4px 20px rgba(22, 25, 43, 0.10) !important;
    }

    .u-legend .u-series td {
      padding: 1.5px 4px !important;
    }

    .u-legend .u-marker {
      width: 12px !important;
      height: 2px !important;
      margin-right: 5px !important;
      border-radius: 1px !important;
    }

    /* Chart date title */
    .u-title {
      color: var(--text-3) !important;
      font-family: var(--font) !important;
      font-size: 11px !important;
      font-weight: 400 !important;
      letter-spacing: 0.02em !important;
    }

    /* ─── Status Bar ─────────────────────────────────────────── */

    #status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--sep);
      font-size: 11px;
      font-weight: 400;
      color: var(--text-3);
      z-index: 20;
    }

    #status-text {
      flex: 1;
      letter-spacing: 0.01em;
    }

    /* ─── Toast Notifications ────────────────────────────────── */

    #toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 400;
      font-family: var(--font);
      min-width: 260px;
      max-width: 380px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(22, 25, 43, 0.10);
      border-radius: var(--r-md);
      box-shadow: 0 4px 24px rgba(22, 25, 43, 0.12), 0 1px 4px rgba(22, 25, 43, 0.07);
      animation: toast-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      color: var(--text-2);
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast.out {
      animation: toast-out 0.2s ease forwards;
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-6px) scale(0.97); }
    }

    .toast-error   { border-left: 3px solid #EF4444; color: #DC2626; }
    .toast-warning { border-left: 3px solid #F59E0B; color: #D97706; }
    .toast-info    { border-left: 3px solid var(--blue); color: var(--blue); }
    .toast-success { border-left: 3px solid #10B981; color: #059669; }

    /* ─── Cursor Tooltip (NAVG-04) ───────────────────────────── */

    #chart-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 100;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(22, 25, 43, 0.12);
      border-radius: var(--r-md);
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-2);
      min-width: 150px;
      max-width: 250px;
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(22, 25, 43, 0.14), 0 2px 8px rgba(22, 25, 43, 0.07);
    }

    .tt-time {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 7px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--sep-strong);
      letter-spacing: -0.01em;
    }

    .tt-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 1.5px 0;
    }

    .tt-swatch {
      width: 10px;
      height: 2px;
      flex-shrink: 0;
      border-radius: 1px;
    }

    .tt-label {
      flex: 1;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .tt-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-1);
      text-align: right;
      flex-shrink: 0;
    }

    /* ─── Phase 4: View tabs ─────────────────────────────────── */
    #view-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
      margin-right: 6px;
    }

    .view-tab {
      padding: 2px 10px;
      background: var(--bg-l2);
      color: var(--text-2);
      border: 1px solid var(--sep-strong);
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: var(--font);
    }

    .view-tab.active {
      background: var(--blue-dim);
      color: var(--blue);
      border-color: rgba(37, 99, 235, 0.25);
    }

    .view-tab:hover:not(.active) {
      background: var(--bg-l3);
      color: var(--text-1);
    }

    #custom-indicator {
      font-size: 11px;
      color: var(--text-3);
      padding: 0 4px;
      display: none;
    }

    /* ─── Phase 4: Parameters button ────────────────────────── */
    #params-btn {
      padding: 2px 10px;
      background: transparent;
      color: var(--text-3);
      border: 1px solid var(--sep-strong);
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      margin-left: 6px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    #params-btn:hover {
      color: var(--text-2);
      border-color: var(--text-3);
      background: var(--bg-l2);
    }

    /* ─── Phase 4: Parameter picker modal ───────────────────── */
    @keyframes backdrop-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes dialog-in {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .picker-dialog {
      background: var(--bg-l1);
      border: 1px solid var(--sep-strong);
      border-radius: var(--r-xl);
      width: 480px;
      max-width: calc(100vw - 32px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: dialog-in 150ms ease-out both;
      box-shadow: 0 24px 64px rgba(22, 25, 43, 0.18), 0 4px 16px rgba(22, 25, 43, 0.08);
    }

    .picker-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--sep);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-1);
      flex-shrink: 0;
    }

    .picker-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
    }

    .picker-group-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 10px 0 6px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .picker-group-chevron {
      display: inline-block;
      transition: transform 0.15s;
      font-size: 9px;
    }

    .picker-group-collapsed .picker-group-chevron {
      transform: rotate(-90deg);
    }

    .picker-group-rows {
      padding-bottom: 4px;
    }

    .picker-group-collapsed .picker-group-rows {
      display: none;
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      cursor: pointer;
    }

    .picker-row label {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-2);
      cursor: pointer;
      flex: 1;
    }

    .picker-badge-binary {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255,159,10,0.9);
      background: rgba(255,159,10,0.12);
      border-radius: 3px;
      padding: 1px 4px;
      flex-shrink: 0;
    }

    .picker-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--sep);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .picker-btn-cancel {
      padding: 5px 14px;
      background: var(--bg-l2);
      color: var(--text-2);
      border: 1px solid var(--sep-strong);
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s;
    }

    .picker-btn-cancel:hover {
      background: var(--bg-l3);
    }

    .picker-btn-apply {
      padding: 5px 18px;
      background: var(--grad);
      color: #fff;
      border: none;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.25);
      transition: opacity 0.15s, box-shadow 0.15s;
    }

    .picker-btn-apply:hover {
      opacity: 0.90;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
    }

    /* Phase 9: Statistics panel */
    #stats-panel { font-family: var(--font); color: var(--text-1); }
    .stats-summary { background: var(--bg-l2); border: 1px solid var(--sep-strong); border-radius: var(--r-sm); padding: 14px 18px; margin-bottom: 18px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
    .stats-summary-item { display: flex; flex-direction: column; gap: 2px; }
    .stats-summary-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
    .stats-summary-value { font-size: 16px; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .stats-table-wrap { overflow-x: auto; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .stats-table th { text-align: left; padding: 6px 10px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--sep-strong); font-weight: 500; }
    .stats-table td { padding: 7px 10px; border-bottom: 1px solid var(--sep-strong); color: var(--text-2); font-variant-numeric: tabular-nums; }
    .stats-table tr.stats-row { cursor: pointer; transition: background 0.12s; }
    .stats-table tr.stats-row:hover td { background: var(--bg-l2); color: var(--text-1); }
    .stats-partial-badge { font-size: 10px; color: var(--text-3); margin-left: 4px; }
    .stats-empty { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 14px; }

    /* Phase 9: Statistics nav button */
    #stats-btn { padding: 4px 12px; background: transparent; color: var(--text-2); border: 1px solid var(--sep-strong); border-radius: var(--r-pill); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: color 0.15s, border-color 0.15s, background 0.15s; }
    #stats-btn:hover { color: var(--text-1); border-color: var(--text-3); background: var(--bg-l2); }
    #stats-btn.active { background: var(--blue-dim); color: var(--blue); border-color: rgba(37, 99, 235, 0.25); }
    /* Phase 10: Run Analysis button (AICO-04) */
    #run-analysis-btn { padding: 4px 12px; background: var(--grad); color: #fff; border: none; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: opacity 0.15s; }
    #run-analysis-btn:hover { opacity: 0.88; }
    #run-analysis-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Phase 11: Analysis panel nav button */
    #analysis-btn { padding: 4px 12px; background: transparent; color: var(--text-2); border: 1px solid var(--sep-strong); border-radius: var(--r-pill); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: color 0.15s, border-color 0.15s, background 0.15s; }
    #analysis-btn:hover { color: var(--text-1); border-color: var(--text-3); background: var(--bg-l2); }
    #analysis-btn.active { background: var(--blue-dim); color: var(--blue); border-color: rgba(37, 99, 235, 0.25); }

    /* Phase 11: Analysis panel layout */
    #analysis-panel { font-family: var(--font); color: var(--text-1); }
    .anls-header { background: var(--bg-l1); border: 1px solid var(--sep-strong); border-radius: var(--r-md); padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
    .anls-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .anls-meta-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
    .anls-meta-value { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .anls-section-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .anls-rec-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .rec-card { background: var(--bg-l1); border: 1px solid var(--sep-strong); border-radius: var(--r-md); padding: 14px 18px; }
    .rec-card-title { font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
    .rec-card-explanation { font-size: 13px; color: var(--text-2); line-height: 1.55; margin-bottom: 10px; }
    .rec-card-setting { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .rec-card-setting-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
    .rec-card-setting-name { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); background: var(--bg-l2); border: 1px solid var(--sep-strong); border-radius: var(--r-sm); padding: 1px 6px; }
    .rec-card-arrow { font-size: 12px; color: var(--text-3); }
    .rec-card-setting-value { font-family: var(--font-mono); font-size: 12px; color: var(--blue); font-weight: 600; background: var(--blue-dim); border: 1px solid rgba(37,99,235,0.18); border-radius: var(--r-sm); padding: 1px 6px; }
    .anls-alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-card { background: var(--bg-l1); border-left: 3px solid var(--orange); border-radius: var(--r-md); padding: 12px 16px; }
    .alert-card-title { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
    .alert-card-detail { font-size: 12px; color: var(--text-2); line-height: 1.5; }
    .anls-empty { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 14px; }
  </style>
</head>
<body>

  <!-- Drop zone: full-page when no file loaded -->
  <div id="drop-zone">
    <div class="drop-eyebrow">OekoFEN Diagnostic Viewer</div>
    <div id="drop-message">
      <!-- File icon -->
      <div id="drop-icon">
        <svg width="40" height="48" viewBox="0 0 40 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 H24 L38 16 V46 H6 Z" rx="2"/>
          <path d="M24 2 V16 H38"/>
          <line x1="12" y1="26" x2="30" y2="26" stroke-width="1.25"/>
          <line x1="12" y1="32" x2="30" y2="32" stroke-width="1.25"/>
          <line x1="12" y1="38" x2="22" y2="38" stroke-width="1.25"/>
        </svg>
      </div>
      <p class="drop-title">Drop your OekoFEN CSV file</p>
      <p class="sub">touch_YYYYMMDD.csv</p>
      <button id="pick-file-btn">Select File</button>
      <input type="file" id="file-input" accept=".csv" style="display:none">
      <!-- Onboarding prompt (v1.1) — hidden once dismissed or settings saved -->
      <div id="onboarding-prompt" style="display:none; margin-top:20px; padding:14px 18px; background:var(--blue-dim); border:1px solid rgba(37,99,235,0.18); border-radius:var(--r-md); text-align:center; max-width:320px;">
        <p style="font-size:13px; color:var(--text-2); margin-bottom:10px;">Connect directly to your OekoFEN heater to download log files without manual export.</p>
        <button id="onboarding-connect-btn" style="background:var(--blue); color:#fff; border:none; border-radius:var(--r-sm); padding:7px 16px; font-size:13px; font-family:var(--font); cursor:pointer; font-weight:500;">Connect to heater</button>
        <button id="onboarding-dismiss-btn" style="background:none; border:none; color:var(--text-3); font-size:12px; cursor:pointer; margin-top:8px; display:block; width:100%; font-family:var(--font);">No thanks, I'll use file drop</button>
      </div>
      <!-- Baseline prompt (v1.2 Phase 8) — shown after settings are saved for the first time -->
      <div id="baseline-prompt" style="display:none; margin-top:14px; padding:14px 18px; background:var(--bg-l1); border:1px solid var(--sep-strong); border-radius:var(--r-md); text-align:center; max-width:320px;">
        <p style="font-size:13px; color:var(--text-2); margin-bottom:4px; font-weight:500;">Load heater settings file</p>
        <p style="font-size:12px; color:var(--text-3); margin-bottom:10px;">Upload your heater's .txt settings export to enable AI analysis.</p>
        <label id="baseline-upload-label" style="display:inline-block; background:var(--blue); color:#fff; border-radius:var(--r-sm); padding:7px 16px; font-size:13px; font-family:var(--font); cursor:pointer; font-weight:500;">
          Choose .txt file
          <input type="file" id="baseline-file-input" accept=".txt" style="display:none">
        </label>
        <button id="baseline-skip-btn" style="background:none; border:none; color:var(--text-3); font-size:12px; cursor:pointer; margin-top:8px; display:block; width:100%; font-family:var(--font);">Skip for now</button>
        <div id="baseline-prompt-status" style="margin-top:8px; font-size:12px; min-height:16px;"></div>
      </div>
      <button id="settings-btn-drop" title="Heater Settings" style="margin-top:12px; background:none; border:1px solid var(--sep-strong); border-radius:var(--r-sm); cursor:pointer; color:var(--text-3); padding:5px 12px; font-size:12px; font-family:var(--font); display:inline-flex; align-items:center; gap:5px; transition:color 0.15s, border-color 0.15s;">
        <span style="font-size:14px;">&#9881;</span> Heater Settings
      </button>
      <!-- Fetch controls (v1.1 Phase 6) — shown only when settings.ip AND settings.password are set -->
      <div id="fetch-controls" style="display:none; margin-top:16px; text-align:center;">
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;">
          <select id="log-selector" style="padding:6px 10px; border:1px solid var(--sep-strong); border-radius:var(--r-sm); font-size:13px; font-family:var(--font); background:var(--bg-l2); color:var(--text-1); cursor:pointer;">
            <option value="log_today">Today</option>
            <option value="log_yesterday">Yesterday</option>
            <option value="log0">Log 0</option>
            <option value="log1">Log 1</option>
            <option value="log2">Log 2</option>
            <option value="log3">Log 3</option>
          </select>
          <button id="fetch-btn" style="padding:7px 18px; background:var(--blue); color:#fff; border:none; border-radius:var(--r-sm); font-size:13px; font-family:var(--font); font-weight:500; cursor:pointer;">Download from Heater</button>
        </div>
      </div>
      <!-- History indicator (v1.2 Phase 7 — DACC-02/03) -->
      <div id="history-indicator" style="margin-top:14px; font-size:12px; color:var(--text-3); text-align:center; min-height:18px;"></div>
    </div>
  </div>

  <!-- Header bar: compact, shown after file loads -->
  <header id="app-header">
    <span id="header-filename"></span>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="settings-btn" title="Heater Settings" style="background:none; border:none; cursor:pointer; color:var(--text-2); padding:4px 6px; border-radius:var(--r-sm); display:flex; align-items:center; font-size:18px; line-height:1; transition:color 0.15s;" onmouseover="this.style.color='var(--text-1)'" onmouseout="this.style.color='var(--text-2)'">&#9881;</button>
      <button id="run-analysis-btn" title="Run AI Analysis" style="display:none;">Run Analysis</button>
      <button id="analysis-btn" title="AI Analysis" style="display:none;">Analysis</button>
      <button id="stats-btn" title="Statistics">Statistics</button>
      <button id="load-another-btn">Load Another</button>
    </div>
  </header>

  <!-- Data summary: shown after load -->
  <div id="data-summary"></div>

  <!-- Toolbar row: reset button (Phase 3); Phase 4 adds view tabs here -->
  <div id="toolbar-row">
    <button id="reset-zoom-btn" style="display:none">Reset Zoom</button>
    <button id="params-btn" style="display:none">Parameters...</button>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- Chart area: Phase 2+ -->
  <div id="chart-area"></div>

  <!-- Minimap overview: Phase 3 populates this with a secondary uPlot instance -->
  <div id="minimap-area"></div>

  <!-- Statistics panel: Phase 9 AGGR -->
  <div id="stats-panel" style="display:none; padding:70px 24px 20px; max-width:900px; margin:0 auto;"></div>

  <!-- Analysis panel: Phase 11 ANLS -->
  <div id="analysis-panel" style="display:none; padding:70px 24px 20px; max-width:900px; margin:0 auto;"></div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="status-text">Ready</span>
  </div>

  <script src="uPlot.iife.min.js"></script>
  <script src="papaparse.min.js"></script>
  <script>
    'use strict';

    // ─── App State ────────────────────────────────────────────────
    const AppState = {
      dataModel:     null,   // { isOekoFEN, timestamps[], columns[], parseIssues, rowCount }
      filename:      null,
      fileDate:      null,
      // Phase 2 — chart state
      chart:         null,   // uPlot instance — set by createChart(), cleared by destroyChart()
      chartSeries:   null,   // series opts array — Phase 4 uses for setSeries(idx, {show})
      // Phase 3 hook points (stubs — Phase 3 populates these):
      onZoomChange:  null,   // function(minTs, maxTs) — minimap subscribes here
      zoomRange:     null,   // { min, max } in Unix seconds — set by Phase 3 zoom plugin
      minimap:       null,   // { instance: uPlot, updateSelection: fn } — set by createMinimap()
    };
    window.AppState = AppState; // expose for debugging

    // ─── Settings (v1.1) ──────────────────────────────────────────
    const SETTINGS_KEY = 'oekofen-viewer-settings';
    const _settings = { ip: '', port: '4321', password: '' };

    // ─── Baseline (v1.2 Phase 8) ──────────────────────────────────
    const BASELINE_KEY = 'oekofen-viewer-baseline';
    let _baseline = null;  // null until a .txt file is successfully loaded

    // ─── AI Settings (v1.2 Phase 10 AICO-01) ──────────────────────
    const AI_SETTINGS_KEY = 'oekofen-viewer-ai-settings';
    const _aiSettings = { backend: 'ollama', credential: '' };
    // backend: 'ollama' | 'claude'
    // credential: Ollama endpoint URL (e.g. 'http://localhost:11434') OR Claude API key

    function loadAiSettings() {
      try {
        const raw = localStorage.getItem(AI_SETTINGS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          _aiSettings.backend    = parsed.backend    || 'ollama';
          _aiSettings.credential = parsed.credential || '';
        }
      } catch (e) {}
    }

    function saveAiSettings(backend, credential) {
      _aiSettings.backend    = backend;
      _aiSettings.credential = credential;
      try {
        localStorage.setItem(AI_SETTINGS_KEY, JSON.stringify({ backend, credential }));
      } catch (e) { console.warn('[saveAiSettings] localStorage write failed:', e.name); }
      if (credential) {
        showRunAnalysisBtn();
      } else {
        hideRunAnalysisBtn();
      }
    }

    // ─── AI Analysis State (v1.2 Phase 10 AICO-04) ─────────────────
    let _lastAnalysis = null;
    // When analysis succeeds: { recommendations: [...], maintenance_alerts: [...], days_analyzed: N, analyzed_at: ms }
    // Phase 11 reads _lastAnalysis directly — no additional fetch needed.

    async function runAnalysis() {
      // Guard: must be served via server.py (not file://)
      if (window.location.protocol === 'file:') {
        showToast(
          'AI analysis requires server.py. Double-click start.bat or run: python server.py',
          'error', 8000
        );
        return;
      }

      // Guard: AI settings must be configured
      if (!_aiSettings.credential) {
        showToast('Configure an AI backend in Settings before running analysis.', 'warning', 5000);
        openSettingsModal();
        return;
      }

      // Show loading state
      const btn = document.getElementById('run-analysis-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Analysing\u2026'; }
      const dismissSending = showToast('Sending data to AI backend\u2026', 'info', 0);

      try {
        const resp = await fetch('/ai-analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            backend:       _aiSettings.backend,
            credential:    _aiSettings.credential,
            baseline_data: _baseline,   // null if not loaded — server handles gracefully
          }),
          signal: AbortSignal.timeout(130000),  // 130s > server's 120s AI timeout
        });

        if (!resp.ok) {
          const errBody = await resp.json().catch(() => null);
          const errMsg = errBody && errBody.error ? errBody.error : 'Check server terminal.';
          showToast('Analysis failed (HTTP ' + resp.status + '): ' + errMsg, 'error', 10000);
          return;
        }

        const data = await resp.json();
        _lastAnalysis = data;

        const recCount   = (data.recommendations  || []).length;
        const alertCount = (data.maintenance_alerts || []).length;
        showToast(
          'Analysis complete \u2014 ' + recCount + ' recommendation' + (recCount !== 1 ? 's' : '') +
          ', ' + alertCount + ' maintenance alert' + (alertCount !== 1 ? 's' : '') + '.',
          'success', 6000
        );
        // Phase 11: auto-open analysis panel with fresh results
        showAnalysisPanel(true);
        renderAnalysisPanel();

      } catch (err) {
        if (err.name === 'TimeoutError' || err.name === 'AbortError') {
          showToast('AI analysis timed out (>130s). Try a faster model or check Ollama.', 'error', 8000);
        } else {
          showToast('Could not reach server for analysis. Is server.py running?', 'error', 8000);
        }
      } finally {
        dismissSending();
        if (btn) { btn.disabled = false; btn.textContent = 'Run Analysis'; }
      }
    }

    function showRunAnalysisBtn() {
      const btn = document.getElementById('run-analysis-btn');
      if (btn) btn.style.display = '';
      const analysisBtn = document.getElementById('analysis-btn');
      if (analysisBtn) analysisBtn.style.display = '';
    }

    function hideRunAnalysisBtn() {
      const btn = document.getElementById('run-analysis-btn');
      if (btn) btn.style.display = 'none';
      const analysisBtn = document.getElementById('analysis-btn');
      if (analysisBtn) analysisBtn.style.display = 'none';
    }

    // ─── Fetch state (v1.1 Phase 6) ───────────────────────────
    let _lastFetchAt = 0;       // Unix ms timestamp when last fetch started (rate-limit guard)
    let _rateLimitTimer = null; // setTimeout handle for re-enabling the download button

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          _settings.ip       = parsed.ip       || '';
          _settings.port     = parsed.port     || '4321';
          _settings.password = parsed.password || '';
        }
      } catch (e) {
        console.warn('[loadSettings] failed:', e.name);
      }
    }

    function saveSettings(ip, port, password) {
      _settings.ip       = ip;
      _settings.port     = port || '4321';
      _settings.password = password;
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          ip:       _settings.ip,
          port:     _settings.port,
          password: _settings.password,
        }));
      } catch (e) {
        console.warn('[saveSettings] localStorage write failed:', e.name);
      }
      // Persist settings to server so it can call the heater API (e.g. /stats live data)
      if (window.location.protocol !== 'file:' && _settings.ip && _settings.password) {
        fetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: _settings.ip, port: _settings.port, password: _settings.password }),
        }).catch(function() {});
      }
      dismissOnboarding();
      // Update fetch controls visibility when settings change
      if (_settings.ip && _settings.password) {
        showFetchControls();
      } else {
        hideFetchControls();
      }
    }

    const ONBD_KEY = 'oekofen-viewer-onboarding';

    function isOnboardingDismissed() {
      try {
        return localStorage.getItem(ONBD_KEY) === 'dismissed';
      } catch (e) {
        return false;
      }
    }

    function dismissOnboarding() {
      try {
        localStorage.setItem(ONBD_KEY, 'dismissed');
      } catch (e) {
        console.warn('[dismissOnboarding] localStorage write failed:', e.name);
      }
      const el = document.getElementById('onboarding-prompt');
      if (el) el.style.display = 'none';
    }

    function initOnboardingPrompt() {
      // Show only if: no settings saved AND not previously dismissed
      if (_settings.ip || isOnboardingDismissed()) return;
      const prompt = document.getElementById('onboarding-prompt');
      if (prompt) prompt.style.display = '';

      const connectBtn = document.getElementById('onboarding-connect-btn');
      if (connectBtn) {
        connectBtn.addEventListener('click', () => {
          dismissOnboarding();
          if (typeof openSettingsModal === 'function') openSettingsModal();
        });
      }

      const dismissBtn = document.getElementById('onboarding-dismiss-btn');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          dismissOnboarding();
        });
      }
    }

    // ─── Baseline prompt UI (v1.2 Phase 8) ────────────────────────

    function showBaselinePrompt() {
      const el = document.getElementById('baseline-prompt');
      if (el) el.style.display = '';
    }

    function hideBaselinePrompt() {
      const el = document.getElementById('baseline-prompt');
      if (el) el.style.display = 'none';
    }

    function initBaselinePrompt() {
      const fileInput = document.getElementById('baseline-file-input');
      const statusEl = document.getElementById('baseline-prompt-status');
      const skipBtn = document.getElementById('baseline-skip-btn');

      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = parseBaselineTxt(ev.target.result);
              parsed.filename = file.name;
              saveBaseline(parsed);
              if (statusEl) {
                statusEl.style.color = 'var(--text-2)';
                statusEl.textContent = '\u2713 Loaded: ' + file.name + ' (' + parsed.sectionCount + ' sections)';
              }
              // Auto-hide after 1.5s on success
              setTimeout(() => hideBaselinePrompt(), 1500);
            } catch (err) {
              if (statusEl) {
                statusEl.style.color = '#DC2626';
                statusEl.textContent = err.message;
              }
              // Reset file input so same file can be retried
              fileInput.value = '';
            }
          };
          reader.readAsText(file, 'utf-8');
        });
      }

      if (skipBtn) {
        skipBtn.addEventListener('click', () => hideBaselinePrompt());
      }
    }

    // ─── Baseline load/save/parse (v1.2 Phase 8) ──────────────────

    function loadBaseline() {
      try {
        const raw = localStorage.getItem(BASELINE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.sections) {
          _baseline = parsed;
        }
      } catch (e) {
        console.warn('[loadBaseline] failed:', e.name);
      }
    }

    function saveBaseline(parsed) {
      _baseline = parsed;
      try {
        localStorage.setItem(BASELINE_KEY, JSON.stringify(parsed));
      } catch (e) {
        console.warn('[saveBaseline] localStorage write failed:', e.name);
      }
    }

    function parseBaselineTxt(rawText) {
      // Returns { filename: null, sectionCount, sections: { name: { settings, schedules } } }
      // Throws Error with descriptive message if zero top-level sections detected.
      const lines = rawText.split(/\r?\n/);
      const sections = {};
      let sectionCount = 0;

      let currentSection = null;   // key into sections{}
      let subStack = [];           // [ { name, indent } ] — path of sub-section labels
      let currentSchedule = null;  // { name, groups }
      let currentGroup = null;     // { days, blocks }

      // Options accumulation state
      let optionsPending = false;  // true while inside a multi-line [ ... ]
      let optionsAccum = '';       // accumulated raw text for current options list
      let lastSettingRef = null;   // reference to the last settings entry (to attach options)

      function indentOf(rawLine) {
        let i = 0;
        while (i < rawLine.length && (rawLine[i] === ' ' || rawLine[i] === '\t')) i++;
        return i;
      }

      function flushOptions() {
        if (!lastSettingRef) return;
        // Parse "[A, B, C]" → ["A", "B", "C"]
        const inner = optionsAccum.replace(/^\[/, '').replace(/\].*$/, '').trim();
        lastSettingRef.options = inner.split(',').map(s => s.trim()).filter(Boolean);
        lastSettingRef = null;
        optionsPending = false;
        optionsAccum = '';
      }

      function subPath(extraLabel) {
        const parts = subStack.map(e => e.name);
        if (extraLabel) parts.push(extraLabel);
        return parts.join(' / ');
      }

      function ensureSection(name) {
        if (!sections[name]) {
          sections[name] = { settings: [], schedules: [] };
          sectionCount++;
        }
      }

      for (const rawLine of lines) {
        const trimmed = rawLine.trimEnd();
        const content = trimmed.trim();
        if (!content) continue;

        const indent = indentOf(trimmed);

        // ── Options continuation ────────────────────────────────────────
        if (optionsPending) {
          optionsAccum += ' ' + content;
          if (content.includes(']')) flushOptions();
          continue;
        }

        // ── Separator line (10+ dashes) ─────────────────────────────────
        if (/^-{10,}/.test(content)) {
          subStack = [];
          currentSchedule = null;
          currentGroup = null;
          continue;
        }

        // ── File header (Anlagennummer at indent 0) ─────────────────────
        if (indent === 0 && /^Anlagennummer\b/.test(content)) continue;

        // ── Top-level section header (indent 0, not a separator) ────────
        // Guard: OekoFEN section names are plain words/phrases — no ;:{}[]",'<>=|
        // This rejects CSV headers (contain ;), JSON lines (contain :{}"[]), etc.
        if (indent === 0 && /^[A-Za-z\u00C0-\u017E][A-Za-z0-9\u00C0-\u017E ()._\-]*$/.test(content)) {
          currentSection = content;
          ensureSection(currentSection);
          subStack = [];
          currentSchedule = null;
          currentGroup = null;
          continue;
        }

        if (!currentSection) continue;

        // ── Tag: line ───────────────────────────────────────────────────
        const tagMatch = content.match(/^Tag:\s+(.+)/);
        if (tagMatch) {
          const days = tagMatch[1].split(/,\s*/).map(d => d.trim()).filter(Boolean);
          currentGroup = { days, blocks: [] };
          if (currentSchedule) currentSchedule.groups.push(currentGroup);
          continue;
        }

        // ── Time block line ─────────────────────────────────────────────
        const timeMatch = content.match(/^(\d{2}:\d{2})\s{2,}(\d{2}:\d{2})(?:\s{2,}(.+))?$/);
        if (timeMatch) {
          const block = {
            from: timeMatch[1],
            to: timeMatch[2],
            mode: timeMatch[3] ? timeMatch[3].trim() : null
          };
          if (currentGroup) {
            currentGroup.blocks.push(block);
          } else if (currentSchedule) {
            // time blocks before any Tag: line — create an unnamed group
            currentGroup = { days: [], blocks: [block] };
            currentSchedule.groups.push(currentGroup);
          }
          continue;
        }

        // ── Adjust sub-section stack for unindent ───────────────────────
        while (subStack.length > 0 && indent <= subStack[subStack.length - 1].indent) {
          subStack.pop();
        }

        // ── Options list start ──────────────────────────────────────────
        if (content.startsWith('[')) {
          optionsAccum = content;
          if (content.includes(']')) {
            flushOptions();
          } else {
            optionsPending = true;
          }
          continue;
        }

        // ── Setting with value (2+ space gap) ──────────────────────────
        const kvMatch = content.match(/^(.+?)\s{2,}(\S.*)$/);
        if (kvMatch) {
          const keyLabel = kvMatch[1].trim();
          const value = kvMatch[2].trim();
          const qualifiedKey = subPath(keyLabel);

          // Detect schedule name entries containing "Zeit"
          if (/\bZeit\b/.test(qualifiedKey) && value === '') {
            // Schedule header with no value — fall through to sub-section logic below
          } else {
            const entry = { key: qualifiedKey, value, options: null };
            sections[currentSection].settings.push(entry);
            lastSettingRef = entry;
            continue;
          }
        }

        // ── Sub-section header (no right-side value, or schedule name) ──
        // Detect schedule entries: labels containing "Zeit" (e.g. "Heizkreis HK1 Zeit 1")
        const scheduleMatch = content.match(/^(.+\bZeit\s+\d+.*)$/);
        if (scheduleMatch) {
          const scheduleName = (currentSection + ' ' + scheduleMatch[1]).trim();
          currentSchedule = { name: scheduleName, groups: [] };
          currentGroup = null;
          sections[currentSection].schedules.push(currentSchedule);
          subStack.push({ name: content, indent });
        } else {
          // Plain sub-section header: push to path stack
          subStack.push({ name: content, indent });
        }
      }

      if (sectionCount === 0) {
        throw new Error('No OekoFEN settings sections found. Is this the correct .txt export?');
      }

      return { filename: null, sectionCount, sections };
    }

    // ─── Column descriptor shape (for Phase 2+) ───────────────────
    // {
    //   rawName: string,        // e.g. "HK1 VL Ist[°C]"
    //   displayName: string,    // trimmed, same as rawName (no translation)
    //   unit: string|null,      // e.g. "°C"
    //   group: string,          // e.g. "Heating Circuit (HK1)"
    //   type: 'continuous'|'discrete',
    //   data: number[],         // parallel to timestamps array
    // }

    // ─── Toast notifications ──────────────────────────────────────
    function showToast(message, type = 'info', duration = 4000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.textContent = message;
      container.appendChild(toast);

      const dismiss = () => {
        toast.classList.add('out');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      };

      if (duration > 0) {
        setTimeout(dismiss, duration);
      }
      return dismiss;
    }

    // ─── Status bar ───────────────────────────────────────────────
    function setStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    // ─── UI state transitions ─────────────────────────────────────
    function showDropZone() {
      document.getElementById('drop-zone').style.display = 'flex';
      document.getElementById('app-header').classList.remove('visible');
      document.getElementById('data-summary').classList.remove('visible');
      document.getElementById('toolbar-row').classList.remove('visible');
      document.getElementById('chart-area').classList.remove('visible');
      document.getElementById('minimap-area').classList.remove('visible');
    }

    function showAppView(filename) {
      // Phase 9: auto-hide stats panel when a new CSV loads
      document.getElementById('stats-panel').style.display = 'none';
      const statsBtn = document.getElementById('stats-btn');
      if (statsBtn) statsBtn.classList.remove('active');
      // Phase 11: auto-hide analysis panel when a new CSV loads
      document.getElementById('analysis-panel').style.display = 'none';
      const analysisBtn = document.getElementById('analysis-btn');
      if (analysisBtn) analysisBtn.classList.remove('active');
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('app-header').classList.add('visible');
      document.getElementById('data-summary').classList.add('visible');
      document.getElementById('toolbar-row').classList.add('visible');
      document.getElementById('chart-area').classList.add('visible');
      document.getElementById('minimap-area').classList.add('visible');
      document.getElementById('header-filename').innerHTML =
        'File: <strong>' + filename + '</strong>';

    // Phase 9: Toggle between stats panel view and chart view
    function showStatsPanel(show) {
      const statsPanel = document.getElementById('stats-panel');
      const chartArea   = document.getElementById('chart-area');
      const minimapArea = document.getElementById('minimap-area');
      const toolbarRow  = document.getElementById('toolbar-row');
      const dataSummary = document.getElementById('data-summary');

      if (show) {
        statsPanel.style.display = 'block';
        chartArea.classList.remove('visible');
        minimapArea.classList.remove('visible');
        toolbarRow.classList.remove('visible');

      } else {
        statsPanel.style.display = 'none';
        chartArea.classList.add('visible');
        minimapArea.classList.add('visible');
        toolbarRow.classList.add('visible');

      }
    }

      const chartArea      = document.getElementById('chart-area');
      const minimapArea    = document.getElementById('minimap-area');
      const toolbarRow     = document.getElementById('toolbar-row');
